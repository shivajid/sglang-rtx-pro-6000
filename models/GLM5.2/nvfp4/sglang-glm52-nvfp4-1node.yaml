apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sglang-glm52-nvfp4
  namespace: default
  labels:
    app: sglang-glm52-nvfp4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sglang-glm52-nvfp4
  serviceName: "sglang-glm52-nvfp4-service"
  template:
    metadata:
      labels:
        app: sglang-glm52-nvfp4
    spec:
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        cloud.google.com/gke-nodepool: g4-384-pool-pm-crwd
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: sglang-container
        image: lmsysorg/sglang:dev-cu13
        imagePullPolicy: Always
        securityContext:
          privileged: true
          capabilities:
            add: ["IPC_LOCK", "SYS_PTRACE"]
        command:
        - python3
        - -m
        - sglang.launch_server
        args:
        - --model-path
        - /models/GLM-5.2-NVFP4
        - --trust-remote-code
        - --tp
        - "8"
        - --dp-size
        - "8"
        - --enable-dp-attention
        - --moe-a2a-backend
        - none
        - --ep-size
        - "1"
        - --moe-runner-backend
        - flashinfer_cutlass
        - --attention-backend
        - flashinfer
        - --kv-cache-dtype
        - fp8_e4m3
        - --dsa-prefill-backend
        - trtllm
        - --dsa-decode-backend
        - trtllm
        - --disable-shared-experts-fusion
        - --disable-piecewise-cuda-graph
        - --mem-fraction-static
        - "0.975"
        - --chunked-prefill-size
        - "2048"
        - --cuda-graph-bs
        - "16"
        - "32"
        - "48"
        - "64"
        - --context-length
        - "9472"
        - --max-running-requests
        - "1024"
        - --reasoning-parser
        - glm45
        - --tool-call-parser
        - glm47
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: HF_TOKEN
        - name: OMP_NUM_THREADS
          value: "8"
        - name: SGLANG_DISABLE_DSA_INDEXER_FUSION
          value: "1"
        - name: SGLANG_ENABLE_SPEC_V2
          value: "True"
        - name: NCCL_DEBUG
          value: INFO
        - name: NCCL_SOCKET_IFNAME
          value: "eth0,eth1"
        - name: NCCL_SOCKET_NTHREADS
          value: "8"
        - name: NCCL_NSOCKS_PERTHREAD
          value: "8"
        - name: NCCL_IB_DISABLE
          value: "1"
        - name: NCCL_P2P_LEVEL
          value: "SYS"
        - name: NCCL_MIN_NCHANNELS
          value: "8"
        - name: NCCL_ALLOC_P2P_NET_LL_BUFFERS
          value: "1"
        - name: SGLANG_SET_CPU_AFFINITY
          value: "0"
        - name: NCCL_NVLS_ENABLE
          value: "0"
        - name: NCCL_CUMEM_ENABLE
          value: "0"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        - name: FLASHINFER_DISABLE_VERSION_CHECK
          value: "1"
        - name: SGLANG_ENABLE_JIT_DEEPGEMM
          value: "0"
        - name: GLOO_SOCKET_IFNAME
          value: "eth0,eth1"
        resources:
          requests:
            nvidia.com/gpu: "8"
          limits:
            nvidia.com/gpu: "8"
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /models
          name: model-disk
          readOnly: true
        - mountPath: /root/.cache/flashinfer
          name: flashinfer-cache
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      - name: model-disk
        persistentVolumeClaim:
          claimName: glm52-hdml-pvc
          readOnly: true
      - name: flashinfer-cache
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sglang-glm52-nvfp4-service
  namespace: default
  labels:
    app: sglang-glm52-nvfp4
spec:
  type: ClusterIP
  selector:
    app: sglang-glm52-nvfp4
  ports:
  - name: http-inference
    port: 8000
    targetPort: 8000
