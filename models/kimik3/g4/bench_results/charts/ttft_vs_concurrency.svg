<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="100%" height="100%" style="background:#181825; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { fill: #cdd6f4; font-size: 18px; font-weight: bold; }
    .subtitle { fill: #a6adc8; font-size: 13px; }
    .axis { stroke: #45475a; stroke-width: 1.5; }
    .grid { stroke: #313244; stroke-dasharray: 4; stroke-width: 1; }
    .label { fill: #bac2de; font-size: 12px; }
    .legend { fill: #cdd6f4; font-size: 12px; font-weight: 500; }
    .dot-label { fill: #ffffff; font-size: 11px; font-weight: 600; text-anchor: middle; }
  </style>

  <!-- Title -->
  <text x="50" y="38" class="title">Kimi-K3 on G4: Time to First Token (TTFT) vs Concurrency</text>
  <text x="50" y="58" class="subtitle">Median Prefill Latency (ms) across Concurrencies 8, 16, 32 (Lower is Better)</text>

  <!-- Grid lines & Y Labels -->
  <line x1="100" y1="350" x2="740" y2="350" class="axis" />
  <text x="85" y="355" class="label" text-anchor="end">0 ms</text>
  <line x1="100" y1="300" x2="740" y2="300" class="grid" />
  <text x="85" y="305" class="label" text-anchor="end">500 ms</text>
  <line x1="100" y1="250" x2="740" y2="250" class="grid" />
  <text x="85" y="255" class="label" text-anchor="end">1000 ms</text>
  <line x1="100" y1="200" x2="740" y2="200" class="grid" />
  <text x="85" y="205" class="label" text-anchor="end">1500 ms</text>
  <line x1="100" y1="150" x2="740" y2="150" class="grid" />
  <text x="85" y="155" class="label" text-anchor="end">2000 ms</text>
  <line x1="100" y1="100" x2="740" y2="100" class="grid" />
  <text x="85" y="105" class="label" text-anchor="end">2500 ms</text>

  <!-- X Axis Lines & Labels -->
  <line x1="180" y1="100" x2="180" y2="350" class="grid" />
  <text x="180" y="375" class="label" text-anchor="middle" font-weight="bold">Concurrency 8</text>
  <line x1="440" y1="100" x2="440" y2="350" class="grid" />
  <text x="440" y="375" class="label" text-anchor="middle" font-weight="bold">Concurrency 16</text>
  <line x1="700" y1="100" x2="700" y2="350" class="grid" />
  <text x="700" y="375" class="label" text-anchor="middle" font-weight="bold">Concurrency 32</text>

  <!-- Line 1: 8k_1k (Peach) -->
  <polyline points="180,137.8 440,158.3 700,176.7" fill="none" stroke="#fab387" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="180" cy="137.8" r="6" fill="#fab387" stroke="#181825" stroke-width="2" />
  <text x="180" y="127.8" class="dot-label">2122 ms</text>
  <circle cx="440" cy="158.3" r="6" fill="#fab387" stroke="#181825" stroke-width="2" />
  <text x="440" y="148.3" class="dot-label">1917 ms</text>
  <circle cx="700" cy="176.7" r="6" fill="#fab387" stroke="#181825" stroke-width="2" />
  <text x="700" y="166.7" class="dot-label">1733 ms</text>

  <!-- Line 2: 1k_1k (Blue) -->
  <polyline points="180,332.3 440,331.8 700,332.3" fill="none" stroke="#89b4fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="180" cy="332.3" r="5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <text x="180" y="322.3" class="dot-label">177 ms</text>
  <circle cx="440" cy="331.8" r="5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <text x="440" y="321.8" class="dot-label">182 ms</text>
  <circle cx="700" cy="332.3" r="5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <text x="700" y="322.3" class="dot-label">177 ms</text>

  <!-- Line 3: 1k_500 (Green) -->
  <polyline points="180,317.5 440,317.4 700,311.7" fill="none" stroke="#a6e3a1" stroke-width="2.5" stroke-dasharray="5,3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="180" cy="317.5" r="4.5" fill="#a6e3a1" />
  <circle cx="440" cy="317.4" r="4.5" fill="#a6e3a1" />
  <circle cx="700" cy="311.7" r="4.5" fill="#a6e3a1" />

  <!-- Line 4: 1k_8k (Teal) -->
  <polyline points="180,318.9 440,318.2 700,315.4" fill="none" stroke="#94e2d5" stroke-width="2.5" stroke-dasharray="5,3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="180" cy="318.9" r="4.5" fill="#94e2d5" />
  <circle cx="440" cy="318.2" r="4.5" fill="#94e2d5" />
  <circle cx="700" cy="315.4" r="4.5" fill="#94e2d5" />

  <!-- Legend -->
  <line x1="220" y1="420" x2="245" y2="420" stroke="#fab387" stroke-width="3" />
  <circle cx="232" cy="420" r="4" fill="#fab387" />
  <text x="252" y="424" class="legend">8k/1k (Long Prompt)</text>

  <line x1="390" y1="420" x2="415" y2="420" stroke="#89b4fa" stroke-width="3" />
  <circle cx="402" cy="420" r="4" fill="#89b4fa" />
  <text x="422" y="424" class="legend">1k/1k (Balanced)</text>

  <line x1="550" y1="420" x2="575" y2="420" stroke="#94e2d5" stroke-width="3" stroke-dasharray="4,3" />
  <circle cx="562" cy="420" r="4" fill="#94e2d5" />
  <text x="582" y="424" class="legend">1k/8k (Long Gen)</text>

  <line x1="700" y1="420" x2="725" y2="420" stroke="#a6e3a1" stroke-width="3" stroke-dasharray="4,3" />
  <circle cx="712" cy="420" r="4" fill="#a6e3a1" />
  <text x="732" y="424" class="legend">1k/500</text>
</svg>