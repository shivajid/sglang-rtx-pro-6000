<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" width="100%" height="100%" style="background:#181825; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { fill: #cdd6f4; font-size: 19px; font-weight: bold; }
    .subtitle { fill: #a6adc8; font-size: 13px; }
    .axis { stroke: #45475a; stroke-width: 1.5; }
    .grid { stroke: #313244; stroke-dasharray: 4; stroke-width: 1; }
    .label { fill: #bac2de; font-size: 12px; }
    .legend { fill: #cdd6f4; font-size: 12px; font-weight: 500; }
    .dot-label-p90 { fill: #f38ba8; font-size: 10px; font-weight: bold; text-anchor: middle; }
    .dot-label-med { fill: #89b4fa; font-size: 10px; font-weight: bold; text-anchor: middle; }
    .zone-box { fill: #f38ba8; fill-opacity: 0.07; stroke: #f38ba8; stroke-dasharray: 4; stroke-width: 1; }
    .zone-text { fill: #f38ba8; font-size: 11px; font-weight: bold; }
  </style>

  <!-- Title -->
  <text x="50" y="38" class="title">1k_8k Queueing Delay &amp; TTFT Analysis: Median vs P90/P99 Tail Latency</text>
  <text x="50" y="58" class="subtitle">Logarithmic Scale: Clear transition from Immediate Admission (C≤64) to Pipelined Queueing (C≥80)</text>

  <!-- Queueing Box -->
  <rect x="540" y="80" width="420" height="270" class="zone-box" rx="6" />
  <text x="555" y="100" class="zone-text">⚠️ Batch Saturation: Requests queued waiting for wave 1 completion</text>

  <!-- Y Axis Grids -->
  <line x1="70" y1="350.0" x2="960" y2="350.0" class="axis" />
  <text x="55" y="354.0" class="label" text-anchor="end">100 ms</text>
  
  <line x1="70" y1="278.9" x2="960" y2="278.9" class="grid" />
  <text x="55" y="282.9" class="label" text-anchor="end">1 s (1k ms)</text>

  <line x1="70" y1="207.9" x2="960" y2="207.9" class="grid" />
  <text x="55" y="211.9" class="label" text-anchor="end">10 s</text>

  <line x1="70" y1="152.6" x2="960" y2="152.6" class="grid" />
  <text x="55" y="156.6" class="label" text-anchor="end">1 min (60s)</text>

  <line x1="70" y1="102.9" x2="960" y2="102.9" class="grid" />
  <text x="55" y="106.9" class="label" text-anchor="end">5 min (300s)</text>

  <!-- X Axis Lines & Labels -->
  <line x1="120" y1="80" x2="120" y2="350" class="grid" /><text x="120" y="375" class="label" text-anchor="middle" font-weight="bold">C=8</text><line x1="220" y1="80" x2="220" y2="350" class="grid" /><text x="220" y="375" class="label" text-anchor="middle" font-weight="bold">C=16</text><line x1="340" y1="80" x2="340" y2="350" class="grid" /><text x="340" y="375" class="label" text-anchor="middle" font-weight="bold">C=32</text><line x1="480" y1="80" x2="480" y2="350" class="grid" /><text x="480" y="375" class="label" text-anchor="middle" font-weight="bold">C=64</text><line x1="590" y1="80" x2="590" y2="350" class="grid" /><text x="590" y="375" class="label" text-anchor="middle" font-weight="bold">C=80</text><line x1="700" y1="80" x2="700" y2="350" class="grid" /><text x="700" y="375" class="label" text-anchor="middle" font-weight="bold">C=96</text><line x1="810" y1="80" x2="810" y2="350" class="grid" /><text x="810" y="375" class="label" text-anchor="middle" font-weight="bold">C=112</text><line x1="920" y1="80" x2="920" y2="350" class="grid" /><text x="920" y="375" class="label" text-anchor="middle" font-weight="bold">C=128</text>

  <!-- P90 Queue Wait (Red line) -->
  <polyline points="120,301.6 220,305.7 340,303.6 480,290.2 590,150.6 700,112.3 810,97.5 920,89.6" fill="none" stroke="#f38ba8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="120" cy="301.6" r="5.5" fill="#f38ba8" stroke="#181825" stroke-width="1.5" />
  <text x="120" y="292.6" class="dot-label-p90">480ms</text><circle cx="220" cy="305.7" r="5.5" fill="#f38ba8" stroke="#181825" stroke-width="1.5" />
  <text x="220" y="296.7" class="dot-label-p90">420ms</text><circle cx="340" cy="303.6" r="5.5" fill="#f38ba8" stroke="#181825" stroke-width="1.5" />
  <text x="340" y="294.6" class="dot-label-p90">450ms</text><circle cx="480" cy="290.2" r="5.5" fill="#f38ba8" stroke="#181825" stroke-width="1.5" />
  <text x="480" y="281.2" class="dot-label-p90">695ms</text><circle cx="590" cy="150.6" r="5.5" fill="#f38ba8" stroke="#181825" stroke-width="1.5" />
  <text x="590" y="141.6" class="dot-label-p90">64.1s</text><circle cx="700" cy="112.3" r="5.5" fill="#f38ba8" stroke="#181825" stroke-width="1.5" />
  <text x="700" y="103.3" class="dot-label-p90">221.7s</text><circle cx="810" cy="97.5" r="5.5" fill="#f38ba8" stroke="#181825" stroke-width="1.5" />
  <text x="810" y="88.5" class="dot-label-p90">357.5s</text><circle cx="920" cy="89.6" r="5.5" fill="#f38ba8" stroke="#181825" stroke-width="1.5" />
  <text x="920" y="80.6" class="dot-label-p90">462.4s</text>

  <!-- Median TTFT (Blue line) -->
  <polyline points="120,315.0 220,314.3 340,311.7 480,298.6 590,294.4 700,269.3 810,288.9 920,241.7" fill="none" stroke="#89b4fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="120" cy="315.0" r="5.5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <text x="120" y="331.0" class="dot-label-med">311ms</text><circle cx="220" cy="314.3" r="5.5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <text x="220" y="330.3" class="dot-label-med">318ms</text><circle cx="340" cy="311.7" r="5.5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <text x="340" y="327.7" class="dot-label-med">346ms</text><circle cx="480" cy="298.6" r="5.5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <text x="480" y="314.6" class="dot-label-med">529ms</text><circle cx="590" cy="294.4" r="5.5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <text x="590" y="310.4" class="dot-label-med">606ms</text><circle cx="700" cy="269.3" r="5.5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <text x="700" y="285.3" class="dot-label-med">1.4s</text><circle cx="810" cy="288.9" r="5.5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <text x="810" y="304.9" class="dot-label-med">723ms</text><circle cx="920" cy="241.7" r="5.5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <text x="920" y="257.7" class="dot-label-med">3.3s</text>

  <!-- Legend -->
  <line x1="280" y1="435" x2="310" y2="435" stroke="#89b4fa" stroke-width="3" />
  <circle cx="295" cy="435" r="4.5" fill="#89b4fa" />
  <text x="320" y="439" class="legend">Median TTFT (Immediate Batch Processing)</text>

  <line x1="620" y1="435" x2="650" y2="435" stroke="#f38ba8" stroke-width="3" />
  <circle cx="635" cy="435" r="4.5" fill="#f38ba8" />
  <text x="660" y="439" class="legend">P90 TTFT (Queue Wait Time before Wave Admission)</text>
</svg>