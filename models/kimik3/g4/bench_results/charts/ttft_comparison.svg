<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#1e1e2e; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { fill: #cdd6f4; font-size: 18px; font-weight: bold; }
    .subtitle { fill: #a6adc8; font-size: 13px; }
    .axis { stroke: #45475a; stroke-width: 1; }
    .grid { stroke: #313244; stroke-dasharray: 4; stroke-width: 1; }
    .label { fill: #bac2de; font-size: 12px; }
    .bar-text { fill: #ffffff; font-size: 11px; font-weight: 600; text-anchor: middle; }
    .legend { fill: #cdd6f4; font-size: 12px; }
  </style>

  <!-- Title -->
  <text x="40" y="35" class="title">Kimi-K3 on G4: Time to First Token (TTFT) by Prompt Length</text>
  <text x="40" y="55" class="subtitle">Comparison of Prefill Latency (Median P50) across Concurrency 8, 16, 32</text>

  <!-- Grid lines -->
  <line x1="80" y1="360" x2="740" y2="360" class="axis" />
  <line x1="80" y1="290" x2="740" y2="290" class="grid" />
  <line x1="80" y1="220" x2="740" y2="220" class="grid" />
  <line x1="80" y1="150" x2="740" y2="150" class="grid" />
  <line x1="80" y1="80" x2="740" y2="80" class="grid" />

  <!-- Y Axis Labels (0 to 2500 ms) -->
  <text x="70" y="365" class="label" text-anchor="end">0 ms</text>
  <text x="70" y="295" class="label" text-anchor="end">625 ms</text>
  <text x="70" y="225" class="label" text-anchor="end">1250 ms</text>
  <text x="70" y="155" class="label" text-anchor="end">1875 ms</text>
  <text x="70" y="85" class="label" text-anchor="end">2500 ms</text>

  <!-- Group 1: 1k_500 -->
  <!-- scale: y = 360 - (val / 2500 * 280) -->
  <!-- c8: 328.9ms -> h=36.8 -> y=323.2 -->
  <rect x="110" y="323" width="28" height="37" rx="4" fill="#89b4fa" />
  <text x="124" y="318" class="bar-text">329ms</text>
  <!-- c16: 344.4ms -> h=38.5 -> y=321.5 -->
  <rect x="142" y="321" width="28" height="39" rx="4" fill="#a6e3a1" />
  <text x="156" y="316" class="bar-text">344ms</text>
  <!-- c32: 360.4ms -> h=40.3 -> y=319.7 -->
  <rect x="174" y="320" width="28" height="40" rx="4" fill="#f9e2af" />
  <text x="188" y="315" class="bar-text">360ms</text>
  <text x="156" y="380" class="label" text-anchor="middle">1k_500</text>

  <!-- Group 2: 1k_1k -->
  <!-- c8: 311.1ms -> h=34.8 -> y=325.2 -->
  <rect x="270" y="325" width="28" height="35" rx="4" fill="#89b4fa" />
  <text x="284" y="320" class="bar-text">311ms</text>
  <!-- c16: 335.4ms -> h=37.5 -> y=322.5 -->
  <rect x="302" y="322" width="28" height="38" rx="4" fill="#a6e3a1" />
  <text x="316" y="317" class="bar-text">335ms</text>
  <!-- c32: 353.5ms -> h=39.6 -> y=320.4 -->
  <rect x="334" y="320" width="28" height="40" rx="4" fill="#f9e2af" />
  <text x="348" y="315" class="bar-text">354ms</text>
  <text x="316" y="380" class="label" text-anchor="middle">1k_1k</text>

  <!-- Group 3: 8k_1k -->
  <!-- c8: 1946.8ms -> h=218.0 -> y=142 -->
  <rect x="430" y="142" width="28" height="218" rx="4" fill="#89b4fa" />
  <text x="444" y="135" class="bar-text">1947ms</text>
  <!-- c16: 2021.0ms -> h=226.3 -> y=133.7 -->
  <rect x="462" y="134" width="28" height="226" rx="4" fill="#a6e3a1" />
  <text x="476" y="127" class="bar-text">2021ms</text>
  <!-- c32: 1179.1ms -> h=132.0 -> y=228 -->
  <rect x="494" y="228" width="28" height="132" rx="4" fill="#f9e2af" />
  <text x="508" y="221" class="bar-text">1179ms</text>
  <text x="476" y="380" class="label" text-anchor="middle">8k_1k (Long Prompt)</text>

  <!-- Group 4: 1k_8k -->
  <!-- c8: 330.2ms -> h=37.0 -> y=323 -->
  <rect x="590" y="323" width="28" height="37" rx="4" fill="#89b4fa" />
  <text x="604" y="318" class="bar-text">330ms</text>
  <!-- c16: 324.4ms -> h=36.3 -> y=323.7 -->
  <rect x="622" y="324" width="28" height="36" rx="4" fill="#a6e3a1" />
  <text x="636" y="319" class="bar-text">324ms</text>
  <!-- c32: 352.8ms -> h=39.5 -> y=320.5 -->
  <rect x="654" y="320" width="28" height="40" rx="4" fill="#f9e2af" />
  <text x="668" y="315" class="bar-text">353ms</text>
  <text x="636" y="380" class="label" text-anchor="middle">1k_8k</text>

  <!-- Legend -->
  <rect x="480" y="35" width="14" height="14" rx="2" fill="#89b4fa" />
  <text x="500" y="47" class="legend">Concurrency = 8</text>
  <rect x="600" y="35" width="14" height="14" rx="2" fill="#a6e3a1" />
  <text x="620" y="47" class="legend">Concurrency = 16</text>
  <rect x="710" y="35" width="14" height="14" rx="2" fill="#f9e2af" />
  <text x="730" y="47" class="legend">C=32</text>
</svg>