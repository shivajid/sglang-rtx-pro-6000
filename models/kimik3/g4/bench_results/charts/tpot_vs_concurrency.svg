<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#181825; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { fill: #cdd6f4; font-size: 19px; font-weight: bold; }
    .subtitle { fill: #a6adc8; font-size: 13px; }
    .axis { stroke: #45475a; stroke-width: 1.5; }
    .grid { stroke: #313244; stroke-dasharray: 4; stroke-width: 1; }
    .label { fill: #bac2de; font-size: 12px; }
    .legend { fill: #cdd6f4; font-size: 12px; font-weight: 500; }
    .dot-label-new { fill: #ffffff; font-size: 11px; font-weight: bold; text-anchor: middle; }
    .dot-label-old { fill: #9399b2; font-size: 10px; font-weight: normal; text-anchor: middle; }
  </style>

  <!-- Title -->
  <text x="50" y="38" class="title">Kimi-K3 Decode Latency (TPOT): New vs Baseline</text>
  <text x="50" y="58" class="subtitle">Mean Time Per Output Token (ms/token) across Concurrencies 8, 16, 32, and 64 (Lower is Better)</text>

  <!-- Grid lines & Y Labels -->
  <line x1="90" y1="350" x2="890" y2="350" class="axis" />
  <text x="75" y="355" class="label" text-anchor="end">0 ms</text>
  <line x1="90" y1="296.4" x2="890" y2="296.4" class="grid" />
  <text x="75" y="301.4" class="label" text-anchor="end">30 ms</text>
  <line x1="90" y1="242.9" x2="890" y2="242.9" class="grid" />
  <text x="75" y="247.9" class="label" text-anchor="end">60 ms</text>
  <line x1="90" y1="189.3" x2="890" y2="189.3" class="grid" />
  <text x="75" y="194.3" class="label" text-anchor="end">90 ms</text>
  <line x1="90" y1="135.7" x2="890" y2="135.7" class="grid" />
  <text x="75" y="140.7" class="label" text-anchor="end">120 ms</text>
  <line x1="90" y1="100.0" x2="890" y2="100.0" class="grid" />
  <text x="75" y="105.0" class="label" text-anchor="end">140 ms</text>

  <!-- X Axis Lines & Labels -->
  <line x1="160" y1="100" x2="160" y2="350" class="grid" />
  <text x="160" y="375" class="label" text-anchor="middle" font-weight="bold">Concurrency 8</text>
  <line x1="380" y1="100" x2="380" y2="350" class="grid" />
  <text x="380" y="375" class="label" text-anchor="middle" font-weight="bold">Concurrency 16</text>
  <line x1="600" y1="100" x2="600" y2="350" class="grid" />
  <text x="600" y="375" class="label" text-anchor="middle" font-weight="bold">Concurrency 32</text>
  <line x1="820" y1="100" x2="820" y2="350" class="grid" />
  <text x="820" y="375" class="label" text-anchor="middle" font-weight="bold">Concurrency 64</text>

  <!-- BASELINE -->
  <polyline points="160,168.4 380,164.5 600,161.3" fill="none" stroke="#585b70" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="160" cy="168.4" r="4" fill="#585b70" />
  <text x="160" y="160.4" class="dot-label-old">101.7 ms (Base)</text>
  <circle cx="380" cy="164.5" r="4" fill="#585b70" />
  <text x="380" y="156.5" class="dot-label-old">103.9 ms</text>
  <circle cx="600" cy="161.3" r="4" fill="#585b70" />
  <text x="600" y="153.3" class="dot-label-old">105.7 ms</text>

  <!-- NEW DEPLOYMENT -->
  <!-- 1k_8k New (Teal) -->
  <polyline points="160,257.2 380,238.3 600,222.3 820,217.9" fill="none" stroke="#94e2d5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="160" cy="257.2" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="160" y="247.2" class="dot-label-new">52.0 ms</text>
  <circle cx="380" cy="238.3" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="380" y="228.3" class="dot-label-new">62.5 ms</text>
  <circle cx="600" cy="222.3" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="600" y="212.3" class="dot-label-new">71.5 ms</text>
  <circle cx="820" cy="217.9" r="7" fill="#a6e3a1" stroke="#181825" stroke-width="2" />
  <text x="820" y="206.9" class="dot-label-new" font-size="12px">74.0 ms</text>

  <!-- 1k_1k New (Blue) -->
  <polyline points="160,258.1 380,237.3 600,215.4" fill="none" stroke="#89b4fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="160" cy="258.1" r="5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <text x="160" y="276.1" class="dot-label-new">51.5 ms</text>
  <circle cx="380" cy="237.3" r="5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <text x="380" y="255.3" class="dot-label-new">63.1 ms</text>
  <circle cx="600" cy="215.4" r="5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <text x="600" y="233.4" class="dot-label-new">75.4 ms</text>

  <!-- Legend -->
  <line x1="150" y1="435" x2="175" y2="435" stroke="#94e2d5" stroke-width="3" />
  <circle cx="162" cy="435" r="4" fill="#94e2d5" />
  <text x="182" y="439" class="legend">1k/8k Reasoning (New: 13.5–19.2 t/s)</text>

  <line x1="450" y1="435" x2="475" y2="435" stroke="#89b4fa" stroke-width="3" />
  <circle cx="462" cy="435" r="4" fill="#89b4fa" />
  <text x="482" y="439" class="legend">1k/1k Balanced (New: 13.3–19.4 t/s)</text>

  <line x1="720" y1="435" x2="745" y2="435" stroke="#585b70" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="732" cy="435" r="3.5" fill="#585b70" />
  <text x="752" y="439" class="legend" fill="#a6adc8">Baseline (Prev Run: ~9.5 t/s)</text>
</svg>