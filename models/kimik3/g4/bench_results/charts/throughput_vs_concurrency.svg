<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#181825; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { fill: #cdd6f4; font-size: 19px; font-weight: bold; }
    .subtitle { fill: #a6adc8; font-size: 13px; }
    .axis { stroke: #45475a; stroke-width: 1.5; }
    .grid { stroke: #313244; stroke-dasharray: 4; stroke-width: 1; }
    .label { fill: #bac2de; font-size: 12px; }
    .legend { fill: #cdd6f4; font-size: 12px; font-weight: 500; }
    .dot-label-new { fill: #ffffff; font-size: 11px; font-weight: bold; text-anchor: middle; }
    .dot-label-old { fill: #9399b2; font-size: 10px; font-weight: normal; text-anchor: middle; }
    .badge { fill: #a6e3a1; font-size: 11px; font-weight: 800; text-anchor: start; }
  </style>

  <!-- Title -->
  <text x="50" y="38" class="title">Kimi-K3 Throughput vs Concurrency (New Deployment vs Baseline)</text>
  <text x="50" y="58" class="subtitle">System Aggregate Output Generation Speed (Tokens/Second) across Concurrencies 8, 16, 32, and 64</text>

  <!-- Grid lines & Y Labels -->
  <line x1="90" y1="350" x2="890" y2="350" class="axis" />
  <text x="75" y="355" class="label" text-anchor="end">0</text>
  <line x1="90" y1="300" x2="890" y2="300" class="grid" />
  <text x="75" y="305" class="label" text-anchor="end">100</text>
  <line x1="90" y1="250" x2="890" y2="250" class="grid" />
  <text x="75" y="255" class="label" text-anchor="end">200</text>
  <line x1="90" y1="200" x2="890" y2="200" class="grid" />
  <text x="75" y="205" class="label" text-anchor="end">300</text>
  <line x1="90" y1="150" x2="890" y2="150" class="grid" />
  <text x="75" y="155" class="label" text-anchor="end">400</text>
  <line x1="90" y1="100" x2="890" y2="100" class="grid" />
  <text x="75" y="105" class="label" text-anchor="end">500 t/s</text>

  <!-- X Axis Lines & Labels -->
  <line x1="160" y1="100" x2="160" y2="350" class="grid" />
  <text x="160" y="375" class="label" text-anchor="middle" font-weight="bold">Concurrency 8</text>
  <line x1="380" y1="100" x2="380" y2="350" class="grid" />
  <text x="380" y="375" class="label" text-anchor="middle" font-weight="bold">Concurrency 16</text>
  <line x1="600" y1="100" x2="600" y2="350" class="grid" />
  <text x="600" y="375" class="label" text-anchor="middle" font-weight="bold">Concurrency 32</text>
  <line x1="820" y1="100" x2="820" y2="350" class="grid" />
  <text x="820" y="375" class="label" text-anchor="middle" font-weight="bold">Concurrency 64 ⚡</text>

  <!-- BASELINE (DASHED) -->
  <polyline points="160,319.1 380,291.3 600,237.6" fill="none" stroke="#585b70" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="160" cy="319.1" r="4" fill="#585b70" />
  <text x="160" y="333.1" class="dot-label-old">62</text>
  <circle cx="380" cy="291.3" r="4" fill="#585b70" />
  <text x="380" y="305.3" class="dot-label-old">117</text>
  <circle cx="600" cy="237.6" r="4" fill="#585b70" />
  <text x="600" y="251.6" class="dot-label-old">225 (Base)</text>

  <!-- NEW DEPLOYMENT -->
  <!-- 1k_8k New (Teal) -->
  <polyline points="160,287.7 380,245.1 600,169.7 820,109.6" fill="none" stroke="#94e2d5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="160" cy="287.7" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="160" y="277.7" class="dot-label-new">124.6</text>
  <circle cx="380" cy="245.1" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="380" y="235.1" class="dot-label-new">209.9</text>
  <circle cx="600" cy="169.7" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="600" y="159.7" class="dot-label-new">360.6</text>
  <circle cx="820" cy="109.6" r="7" fill="#a6e3a1" stroke="#181825" stroke-width="2.5" />
  <text x="820" y="98.6" class="dot-label-new" font-size="12px">480.9 t/s 🏆</text>

  <!-- 1k_1k New (Blue) -->
  <polyline points="160,288.7 380,243.5 600,171.2" fill="none" stroke="#89b4fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="160" cy="288.7" r="5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <circle cx="380" cy="243.5" r="5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <circle cx="600" cy="171.2" r="5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <text x="600" y="161.2" class="dot-label-new">357.6</text>

  <!-- 1k_500 New (Green) -->
  <polyline points="160,332.7 380,257.1 600,200.9" fill="none" stroke="#a6e3a1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="160" cy="332.7" r="4.5" fill="#a6e3a1" />
  <circle cx="380" cy="257.1" r="4.5" fill="#a6e3a1" />
  <circle cx="600" cy="200.9" r="4.5" fill="#a6e3a1" />

  <!-- 8k_1k New (Peach) -->
  <polyline points="160,305.1 380,271.4 600,224.5" fill="none" stroke="#fab387" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="160" cy="305.1" r="4.5" fill="#fab387" />
  <circle cx="380" cy="271.4" r="4.5" fill="#fab387" />
  <circle cx="600" cy="224.5" r="4.5" fill="#fab387" />

  <!-- Legend -->
  <line x1="90" y1="435" x2="115" y2="435" stroke="#94e2d5" stroke-width="3" />
  <circle cx="102" cy="435" r="4" fill="#94e2d5" />
  <text x="122" y="439" class="legend">1k/8k Reasoning (New)</text>

  <line x1="280" y1="435" x2="305" y2="435" stroke="#89b4fa" stroke-width="3" />
  <circle cx="292" cy="435" r="4" fill="#89b4fa" />
  <text x="312" y="439" class="legend">1k/1k Balanced (New)</text>

  <line x1="470" y1="435" x2="495" y2="435" stroke="#fab387" stroke-width="3" />
  <circle cx="482" cy="435" r="4" fill="#fab387" />
  <text x="502" y="439" class="legend">8k/1k Long Prompt (New)</text>

  <line x1="680" y1="435" x2="705" y2="435" stroke="#585b70" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="692" cy="435" r="3.5" fill="#585b70" />
  <text x="712" y="439" class="legend" fill="#a6adc8">Baseline (Prev Run)</text>
</svg>