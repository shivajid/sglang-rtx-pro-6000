<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="100%" height="100%" style="background:#181825; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { fill: #cdd6f4; font-size: 18px; font-weight: bold; }
    .subtitle { fill: #a6adc8; font-size: 13px; }
    .axis { stroke: #45475a; stroke-width: 1.5; }
    .grid { stroke: #313244; stroke-dasharray: 4; stroke-width: 1; }
    .label { fill: #bac2de; font-size: 12px; }
    .legend { fill: #cdd6f4; font-size: 12px; font-weight: 500; }
    .dot-label { fill: #ffffff; font-size: 11px; font-weight: 600; text-anchor: middle; }
  </style>

  <!-- Title -->
  <text x="50" y="38" class="title">Kimi-K3 on G4: Output Token Throughput vs Concurrency</text>
  <text x="50" y="58" class="subtitle">System Aggregate Output Generation Speed (Tokens/Second) across Concurrencies 8, 16, 32</text>

  <!-- Grid lines & Y Labels -->
  <line x1="100" y1="350" x2="740" y2="350" class="axis" />
  <text x="85" y="355" class="label" text-anchor="end">0</text>
  <line x1="100" y1="287.5" x2="740" y2="287.5" class="grid" />
  <text x="85" y="292.5" class="label" text-anchor="end">100</text>
  <line x1="100" y1="225.0" x2="740" y2="225.0" class="grid" />
  <text x="85" y="230.0" class="label" text-anchor="end">200</text>
  <line x1="100" y1="162.5" x2="740" y2="162.5" class="grid" />
  <text x="85" y="167.5" class="label" text-anchor="end">300</text>
  <line x1="100" y1="100.0" x2="740" y2="100.0" class="grid" />
  <text x="85" y="105.0" class="label" text-anchor="end">400 t/s</text>

  <!-- X Axis Lines & Labels -->
  <line x1="180" y1="100" x2="180" y2="350" class="grid" />
  <text x="180" y="375" class="label" text-anchor="middle" font-weight="bold">Concurrency 8</text>
  <line x1="440" y1="100" x2="440" y2="350" class="grid" />
  <text x="440" y="375" class="label" text-anchor="middle" font-weight="bold">Concurrency 16</text>
  <line x1="700" y1="100" x2="700" y2="350" class="grid" />
  <text x="700" y="375" class="label" text-anchor="middle" font-weight="bold">Concurrency 32</text>

  <!-- Line 1: 1k_8k (Teal) -->
  <polyline points="180,272.1 440,218.8 700,124.6" fill="none" stroke="#94e2d5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="180" cy="272.1" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="180" y="262.1" class="dot-label">124.6 t/s</text>
  <circle cx="440" cy="218.8" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="440" y="208.8" class="dot-label">209.9 t/s</text>
  <circle cx="700" cy="124.6" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="700" y="114.6" class="dot-label">360.7 t/s</text>

  <!-- Line 2: 1k_1k (Blue) -->
  <polyline points="180,273.3 440,216.9 700,126.5" fill="none" stroke="#89b4fa" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="180" cy="273.3" r="5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <circle cx="440" cy="216.9" r="5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <circle cx="700" cy="126.5" r="5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />

  <!-- Line 3: 1k_500 (Green) -->
  <polyline points="180,328.4 440,233.8 700,163.7" fill="none" stroke="#a6e3a1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="180" cy="328.4" r="5" fill="#a6e3a1" stroke="#181825" stroke-width="1.5" />
  <circle cx="440" cy="233.8" r="5" fill="#a6e3a1" stroke="#181825" stroke-width="1.5" />
  <circle cx="700" cy="163.7" r="5" fill="#a6e3a1" stroke="#181825" stroke-width="1.5" />

  <!-- Line 4: 8k_1k (Peach) -->
  <polyline points="180,293.9 440,251.7 700,193.1" fill="none" stroke="#fab387" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="180" cy="293.9" r="5" fill="#fab387" stroke="#181825" stroke-width="1.5" />
  <circle cx="440" cy="251.7" r="5" fill="#fab387" stroke="#181825" stroke-width="1.5" />
  <circle cx="700" cy="193.1" r="5" fill="#fab387" stroke="#181825" stroke-width="1.5" />

  <!-- Legend -->
  <line x1="220" y1="420" x2="245" y2="420" stroke="#94e2d5" stroke-width="3" />
  <circle cx="232" cy="420" r="4" fill="#94e2d5" />
  <text x="252" y="424" class="legend">1k/8k (Reasoning)</text>

  <line x1="370" y1="420" x2="395" y2="420" stroke="#89b4fa" stroke-width="3" stroke-dasharray="4,3" />
  <circle cx="382" cy="420" r="4" fill="#89b4fa" />
  <text x="402" y="424" class="legend">1k/1k (Balanced)</text>

  <line x1="520" y1="420" x2="545" y2="420" stroke="#a6e3a1" stroke-width="3" />
  <circle cx="532" cy="420" r="4" fill="#a6e3a1" />
  <text x="552" y="424" class="legend">1k/500 (Chat)</text>

  <line x1="660" y1="420" x2="685" y2="420" stroke="#fab387" stroke-width="3" />
  <circle cx="672" cy="420" r="4" fill="#fab387" />
  <text x="692" y="424" class="legend">8k/1k (Long Context)</text>
</svg>