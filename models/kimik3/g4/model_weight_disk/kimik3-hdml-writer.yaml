apiVersion: v1
kind: PersistentVolume
metadata:
  name: kimik3-hdml-pv
spec:
  storageClassName: ""
  capacity:
    storage: 2000Gi
  accessModes:
    - ReadWriteOnce
  claimRef:
    namespace: default
    name: kimik3-hdml-writer-pvc
  csi:
    driver: pd.csi.storage.gke.io
    volumeHandle: projects/<YOUR_PROJECT_ID>/zones/<YOUR_ZONE>/disks/kimik3-hyperdisk-ml
    fsType: ext4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kimik3-hdml-writer-pvc
  namespace: default
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2000Gi
  volumeName: kimik3-hdml-pv
