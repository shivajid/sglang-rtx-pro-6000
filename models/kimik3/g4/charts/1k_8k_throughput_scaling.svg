<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" width="100%" height="100%" style="background:#181825; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { fill: #cdd6f4; font-size: 19px; font-weight: bold; }
    .subtitle { fill: #a6adc8; font-size: 13px; }
    .axis { stroke: #45475a; stroke-width: 1.5; }
    .grid { stroke: #313244; stroke-dasharray: 4; stroke-width: 1; }
    .label { fill: #bac2de; font-size: 12px; }
    .legend { fill: #cdd6f4; font-size: 12px; font-weight: 500; }
    .dot-label-new { fill: #ffffff; font-size: 11px; font-weight: bold; text-anchor: middle; }
    .dot-label-old { fill: #9399b2; font-size: 10px; font-weight: normal; text-anchor: middle; }
    .badge { fill: #a6e3a1; font-size: 11px; font-weight: 800; text-anchor: middle; }
    .zone-box { fill: #fab387; fill-opacity: 0.07; stroke: #fab387; stroke-dasharray: 4; stroke-width: 1; }
    .zone-text { fill: #fab387; font-size: 11px; font-weight: bold; }
  </style>

  <!-- Title -->
  <text x="50" y="38" class="title">1k_8k Reasoning Throughput: New Run vs Previous Baseline (C=8 to 128)</text>
  <text x="50" y="58" class="subtitle">System Aggregate Output Tokens/Sec across Concurrency Sweeps (Plateaus at Compute Saturation ~580 tok/s)</text>

  <!-- Queueing Zone Annotation -->
  <rect x="540" y="85" width="420" height="265" class="zone-box" rx="6" />
  <text x="555" y="105" class="zone-text">⚡ Compute Saturation &amp; Queueing Zone (C ≥ 80)</text>

  <!-- Grid lines & Y Labels -->
  <line x1="70" y1="350" x2="960" y2="350" class="axis" />
  <text x="55" y="355" class="label" text-anchor="end">0</text>
  <line x1="70" y1="290" x2="960" y2="290" class="grid" />
  <text x="55" y="295" class="label" text-anchor="end">150</text>
  <line x1="70" y1="230" x2="960" y2="230" class="grid" />
  <text x="55" y="235" class="label" text-anchor="end">300</text>
  <line x1="70" y1="170" x2="960" y2="170" class="grid" />
  <text x="55" y="175" class="label" text-anchor="end">450</text>
  <line x1="70" y1="110" x2="960" y2="110" class="grid" />
  <text x="55" y="115" class="label" text-anchor="end">600 t/s</text>

  <!-- X Axis Lines & Labels -->
  <line x1="120" y1="90" x2="120" y2="350" class="grid" /><text x="120" y="375" class="label" text-anchor="middle" font-weight="bold">C=8</text><line x1="220" y1="90" x2="220" y2="350" class="grid" /><text x="220" y="375" class="label" text-anchor="middle" font-weight="bold">C=16</text><line x1="340" y1="90" x2="340" y2="350" class="grid" /><text x="340" y="375" class="label" text-anchor="middle" font-weight="bold">C=32</text><line x1="480" y1="90" x2="480" y2="350" class="grid" /><text x="480" y="375" class="label" text-anchor="middle" font-weight="bold">C=64</text><line x1="590" y1="90" x2="590" y2="350" class="grid" /><text x="590" y="375" class="label" text-anchor="middle" font-weight="bold">C=80</text><line x1="700" y1="90" x2="700" y2="350" class="grid" /><text x="700" y="375" class="label" text-anchor="middle" font-weight="bold">C=96</text><line x1="810" y1="90" x2="810" y2="350" class="grid" /><text x="810" y="375" class="label" text-anchor="middle" font-weight="bold">C=112</text><line x1="920" y1="90" x2="920" y2="350" class="grid" /><text x="920" y="375" class="label" text-anchor="middle" font-weight="bold">C=128</text>

  <!-- PREVIOUS BASELINE LINE (Dashed Gray) -->
  <polyline points="120,325.2 220,303.0 340,260.1" fill="none" stroke="#6c7086" stroke-width="2.5" stroke-dasharray="5,4" />
  <circle cx="120" cy="325.2" r="4.5" fill="#6c7086" />
  <text x="120" y="340.2" class="dot-label-old">62</text>
  <circle cx="220" cy="303.0" r="4.5" fill="#6c7086" />
  <text x="220" y="318.0" class="dot-label-old">117</text>
  <circle cx="340" cy="260.1" r="4.5" fill="#6c7086" />
  <text x="340" y="275.1" class="dot-label-old">225 (Base)</text>

  <!-- NEW DEPLOYMENT (Solid Vibrant Teal) -->
  <polyline points="120,300.2 220,266.0 340,205.7 480,157.7 590,124.6 700,131.9 810,116.6 920,118.2" fill="none" stroke="#94e2d5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <circle cx="120" cy="300.2" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="120" y="290.2" class="dot-label-new">124.6</text><circle cx="220" cy="266.0" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="220" y="256.0" class="dot-label-new">209.9</text><circle cx="340" cy="205.7" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="340" y="195.7" class="dot-label-new">360.6</text><circle cx="480" cy="157.7" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="480" y="147.7" class="dot-label-new">480.9</text><circle cx="590" cy="124.6" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="590" y="114.6" class="dot-label-new">563.5</text><circle cx="700" cy="131.9" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="700" y="121.9" class="dot-label-new">545.3</text><circle cx="810" cy="116.6" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="810" y="106.6" class="dot-label-new">583.6</text><circle cx="920" cy="118.2" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="920" y="108.2" class="dot-label-new">579.5</text>

  <!-- Highlight Gain Badges -->
  <text x="340" y="182.7" class="badge">+60.5% 🚀</text>
  <text x="480" y="134.7" class="badge">+113.9% 🚀</text>
  <text x="810" y="93.6" class="badge">Peak: 583.6 t/s 🏆</text>

  <!-- Legend -->
  <line x1="280" y1="435" x2="310" y2="435" stroke="#94e2d5" stroke-width="3.5" />
  <circle cx="295" cy="435" r="5" fill="#94e2d5" />
  <text x="320" y="439" class="legend">New SGLang Nightly Run (1k_8k)</text>

  <line x1="580" y1="435" x2="610" y2="435" stroke="#6c7086" stroke-width="2.5" stroke-dasharray="5,4" />
  <circle cx="595" cy="435" r="4" fill="#6c7086" />
  <text x="620" y="439" class="legend" fill="#a6adc8">Previous Baseline (1k_8k)</text>
</svg>