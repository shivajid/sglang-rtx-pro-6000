<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" width="100%" height="100%" style="background:#181825; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { fill: #cdd6f4; font-size: 19px; font-weight: bold; }
    .subtitle { fill: #a6adc8; font-size: 13px; }
    .axis { stroke: #45475a; stroke-width: 1.5; }
    .grid { stroke: #313244; stroke-dasharray: 4; stroke-width: 1; }
    .label { fill: #bac2de; font-size: 12px; }
    .legend { fill: #cdd6f4; font-size: 12px; font-weight: 500; }
    .dot-label-new { fill: #ffffff; font-size: 11px; font-weight: bold; text-anchor: middle; }
    .dot-label-old { fill: #9399b2; font-size: 10px; font-weight: normal; text-anchor: middle; }
    .badge { fill: #a6e3a1; font-size: 11px; font-weight: 800; text-anchor: start; }
  </style>

  <!-- Title -->
  <text x="50" y="38" class="title">1k_8k Decode Latency (TPOT): New Run vs Baseline (C=8 to 128)</text>
  <text x="50" y="58" class="subtitle">Mean Time Per Output Token (ms/tok) — Remains Stable (~78 ms/tok) Even Under Maximum 128 Concurrency</text>

  <!-- Grid lines & Y Labels -->
  <line x1="70" y1="350" x2="960" y2="350" class="axis" />
  <text x="55" y="355" class="label" text-anchor="end">0 ms</text>
  <line x1="70" y1="285" x2="960" y2="285" class="grid" />
  <text x="55" y="290" class="label" text-anchor="end">30 ms</text>
  <line x1="70" y1="220" x2="960" y2="220" class="grid" />
  <text x="55" y="225" class="label" text-anchor="end">60 ms</text>
  <line x1="70" y1="155" x2="960" y2="155" class="grid" />
  <text x="55" y="160" class="label" text-anchor="end">90 ms</text>
  <line x1="70" y1="90" x2="960" y2="90" class="grid" />
  <text x="55" y="95" class="label" text-anchor="end">120 ms</text>

  <!-- X Axis Lines & Labels -->
  <line x1="120" y1="90" x2="120" y2="350" class="grid" /><text x="120" y="375" class="label" text-anchor="middle" font-weight="bold">C=8</text><line x1="220" y1="90" x2="220" y2="350" class="grid" /><text x="220" y="375" class="label" text-anchor="middle" font-weight="bold">C=16</text><line x1="340" y1="90" x2="340" y2="350" class="grid" /><text x="340" y="375" class="label" text-anchor="middle" font-weight="bold">C=32</text><line x1="480" y1="90" x2="480" y2="350" class="grid" /><text x="480" y="375" class="label" text-anchor="middle" font-weight="bold">C=64</text><line x1="590" y1="90" x2="590" y2="350" class="grid" /><text x="590" y="375" class="label" text-anchor="middle" font-weight="bold">C=80</text><line x1="700" y1="90" x2="700" y2="350" class="grid" /><text x="700" y="375" class="label" text-anchor="middle" font-weight="bold">C=96</text><line x1="810" y1="90" x2="810" y2="350" class="grid" /><text x="810" y="375" class="label" text-anchor="middle" font-weight="bold">C=112</text><line x1="920" y1="90" x2="920" y2="350" class="grid" /><text x="920" y="375" class="label" text-anchor="middle" font-weight="bold">C=128</text>

  <!-- BASELINE (Dashed) -->
  <polyline points="120,129.6 220,124.9 340,121.1" fill="none" stroke="#6c7086" stroke-width="2.5" stroke-dasharray="5,4" />
  <circle cx="120" cy="129.6" r="4.5" fill="#6c7086" />
  <text x="120" y="121.6" class="dot-label-old">101.7 ms</text>
  <circle cx="220" cy="124.9" r="4.5" fill="#6c7086" />
  <text x="220" y="116.9" class="dot-label-old">103.9 ms</text>
  <circle cx="340" cy="121.1" r="4.5" fill="#6c7086" />
  <text x="340" y="113.1" class="dot-label-old">105.7 ms (Base)</text>

  <!-- NEW DEPLOYMENT (Solid Vibrant Teal) -->
  <polyline points="120,237.4 220,214.5 340,195.1 480,189.7 590,181.7 700,180.5 810,179.2 920,179.9" fill="none" stroke="#94e2d5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <circle cx="120" cy="237.4" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="120" y="254.4" class="dot-label-new">52.0 ms</text><circle cx="220" cy="214.5" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="220" y="231.5" class="dot-label-new">62.5 ms</text><circle cx="340" cy="195.1" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="340" y="185.1" class="dot-label-new">71.5 ms</text><circle cx="480" cy="189.7" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="480" y="179.7" class="dot-label-new">74.0 ms</text><circle cx="590" cy="181.7" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="590" y="171.7" class="dot-label-new">77.7 ms</text><circle cx="700" cy="180.5" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="700" y="170.5" class="dot-label-new">78.2 ms</text><circle cx="810" cy="179.2" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="810" y="169.2" class="dot-label-new">78.8 ms</text><circle cx="920" cy="179.9" r="6" fill="#94e2d5" stroke="#181825" stroke-width="2" />
  <text x="920" y="169.9" class="dot-label-new">78.5 ms</text>

  <!-- Legend -->
  <line x1="280" y1="435" x2="310" y2="435" stroke="#94e2d5" stroke-width="3.5" />
  <circle cx="295" cy="435" r="5" fill="#94e2d5" />
  <text x="320" y="439" class="legend">New Run: 12.7–19.2 tokens/sec/user</text>

  <line x1="620" y1="435" x2="650" y2="435" stroke="#6c7086" stroke-width="2.5" stroke-dasharray="5,4" />
  <circle cx="635" cy="435" r="4" fill="#6c7086" />
  <text x="660" y="439" class="legend" fill="#a6adc8">Baseline: ~9.5 tokens/sec/user</text>
</svg>