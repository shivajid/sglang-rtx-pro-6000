<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#181825; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { fill: #cdd6f4; font-size: 19px; font-weight: bold; }
    .subtitle { fill: #a6adc8; font-size: 13px; }
    .axis { stroke: #45475a; stroke-width: 1.5; }
    .grid { stroke: #313244; stroke-dasharray: 4; stroke-width: 1; }
    .label { fill: #bac2de; font-size: 12px; }
    .legend { fill: #cdd6f4; font-size: 12px; font-weight: 500; }
    .dot-label-new { fill: #ffffff; font-size: 11px; font-weight: bold; text-anchor: middle; }
    .dot-label-old { fill: #9399b2; font-size: 10px; font-weight: normal; text-anchor: middle; }
  </style>

  <!-- Title -->
  <text x="50" y="38" class="title">Kimi-K3 Time to First Token (TTFT): New vs Baseline</text>
  <text x="50" y="58" class="subtitle">Median Prefill Latency (ms) across Concurrencies 8, 16, 32, and 64 (Lower is Better)</text>

  <!-- Grid lines & Y Labels -->
  <line x1="90" y1="350" x2="890" y2="350" class="axis" />
  <text x="75" y="355" class="label" text-anchor="end">0 ms</text>
  <line x1="90" y1="300" x2="890" y2="300" class="grid" />
  <text x="75" y="305" class="label" text-anchor="end">500 ms</text>
  <line x1="90" y1="250" x2="890" y2="250" class="grid" />
  <text x="75" y="255" class="label" text-anchor="end">1000 ms</text>
  <line x1="90" y1="200" x2="890" y2="200" class="grid" />
  <text x="75" y="205" class="label" text-anchor="end">1500 ms</text>
  <line x1="90" y1="150" x2="890" y2="150" class="grid" />
  <text x="75" y="155" class="label" text-anchor="end">2000 ms</text>
  <line x1="90" y1="100" x2="890" y2="100" class="grid" />
  <text x="75" y="105" class="label" text-anchor="end">2500 ms</text>

  <!-- X Axis Lines & Labels -->
  <line x1="160" y1="100" x2="160" y2="350" class="grid" />
  <text x="160" y="375" class="label" text-anchor="middle" font-weight="bold">Concurrency 8</text>
  <line x1="380" y1="100" x2="380" y2="350" class="grid" />
  <text x="380" y="375" class="label" text-anchor="middle" font-weight="bold">Concurrency 16</text>
  <line x1="600" y1="100" x2="600" y2="350" class="grid" />
  <text x="600" y="375" class="label" text-anchor="middle" font-weight="bold">Concurrency 32</text>
  <line x1="820" y1="100" x2="820" y2="350" class="grid" />
  <text x="820" y="375" class="label" text-anchor="middle" font-weight="bold">Concurrency 64</text>

  <!-- BASELINE (DASHED) -->
  <!-- 1k_1k Baseline -->
  <polyline points="160,318.9 380,316.5 600,314.6" fill="none" stroke="#585b70" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="160" cy="318.9" r="4" fill="#585b70" />
  <text x="160" y="310.9" class="dot-label-old">311 ms (Base)</text>
  <circle cx="380" cy="316.5" r="4" fill="#585b70" />
  <text x="380" y="308.5" class="dot-label-old">335 ms</text>
  <circle cx="600" cy="314.6" r="4" fill="#585b70" />
  <text x="600" y="306.6" class="dot-label-old">354 ms</text>

  <!-- 8k_1k Baseline -->
  <polyline points="160,155.3 380,147.9 600,232.1" fill="none" stroke="#6c5344" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="160" cy="155.3" r="4" fill="#6c5344" />
  <circle cx="380" cy="147.9" r="4" fill="#6c5344" />
  <circle cx="600" cy="232.1" r="4" fill="#6c5344" />

  <!-- NEW DEPLOYMENT -->
  <!-- 8k_1k New (Peach) -->
  <polyline points="160,137.8 380,158.3 600,176.7" fill="none" stroke="#fab387" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="160" cy="137.8" r="6" fill="#fab387" stroke="#181825" stroke-width="2" />
  <text x="160" y="127.8" class="dot-label-new">2122 ms</text>
  <circle cx="380" cy="158.3" r="6" fill="#fab387" stroke="#181825" stroke-width="2" />
  <text x="380" y="148.3" class="dot-label-new">1917 ms</text>
  <circle cx="600" cy="176.7" r="6" fill="#fab387" stroke="#181825" stroke-width="2" />
  <text x="600" y="166.7" class="dot-label-new">1733 ms</text>

  <!-- 1k_8k New (Teal) -->
  <polyline points="160,318.9 380,318.2 600,315.4 820,297.1" fill="none" stroke="#94e2d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="160" cy="318.9" r="5" fill="#94e2d5" />
  <circle cx="380" cy="318.2" r="5" fill="#94e2d5" />
  <circle cx="600" cy="315.4" r="5" fill="#94e2d5" />
  <circle cx="820" cy="297.1" r="6" fill="#94e2d5" />
  <text x="820" y="287.1" class="dot-label-new">529 ms</text>

  <!-- 1k_1k New (Blue) -->
  <polyline points="160,332.3 380,331.8 600,332.3" fill="none" stroke="#89b4fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="160" cy="332.3" r="5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <text x="160" y="322.3" class="dot-label-new">177 ms</text>
  <circle cx="380" cy="331.8" r="5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <text x="380" y="321.8" class="dot-label-new">182 ms</text>
  <circle cx="600" cy="332.3" r="5" fill="#89b4fa" stroke="#181825" stroke-width="1.5" />
  <text x="600" y="322.3" class="dot-label-new">177 ms</text>

  <!-- Legend -->
  <line x1="120" y1="435" x2="145" y2="435" stroke="#fab387" stroke-width="3" />
  <circle cx="132" cy="435" r="4" fill="#fab387" />
  <text x="152" y="439" class="legend">8k/1k Long Prompt (New)</text>

  <line x1="360" y1="435" x2="385" y2="435" stroke="#89b4fa" stroke-width="3" />
  <circle cx="372" cy="435" r="4" fill="#89b4fa" />
  <text x="392" y="439" class="legend">1k/1k Standard (New)</text>

  <line x1="570" y1="435" x2="595" y2="435" stroke="#94e2d5" stroke-width="3" />
  <circle cx="582" cy="435" r="4" fill="#94e2d5" />
  <text x="602" y="439" class="legend">1k/8k Reasoning (New)</text>

  <line x1="770" y1="435" x2="795" y2="435" stroke="#585b70" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="782" cy="435" r="3.5" fill="#585b70" />
  <text x="802" y="439" class="legend" fill="#a6adc8">Baseline</text>
</svg>