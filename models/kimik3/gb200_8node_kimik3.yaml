---
# Source: lws-deployment/templates/lws-svc.yaml
apiVersion: v1
kind: Service
metadata:
  name: shivajid-sglang-kimi-k3-svc
  namespace: shivajid
  labels:
    app: shivajid-sglang-kimi-k3
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 30100
      targetPort: 30100
      protocol: TCP
  selector:
    leaderworkerset.sigs.k8s.io/name: shivajid-sglang-kimi-k3
    leaderworkerset.sigs.k8s.io/worker-index: "0"
---
# Source: lws-deployment/templates/lws-compute-domain.yaml
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: shivajid-sglang-kimi-k3-compute-domain
  namespace: shivajid
spec:
  numNodes: 8
  channel:
    resourceClaimTemplate:
      name: shivajid-sglang-kimi-k3-compute-domain-claim
---
# Source: lws-deployment/templates/lws-launcher.yaml
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: shivajid-sglang-kimi-k3
  namespace: shivajid
  labels:
    app: shivajid-sglang-kimi-k3
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 8
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          role: leader
          app: shivajid-sglang-kimi-k3
        annotations:
          gke-gcsfuse/volumes: "true"
          gke-gcsfuse/cpu-limit: "0"
          gke-gcsfuse/memory-limit: "0"
          gke-gcsfuse/ephemeral-storage-limit: "0"
          gke-gcsfuse/file-cache-capacity: "500Gi"
          gke-gcsfuse/cache-path: "/gcs-cache"
          networking.gke.io/default-interface: "eth0"
      spec:
        nodeSelector:
         cloud.google.com/gce-topology-block: "1acd074d42cd3be9e4486b524db2e9ab"
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        serviceAccountName: workload-identity-k8s-sa
        automountServiceAccountToken: true
        subdomain: shivajid-sglang-kimi-k3
        restartPolicy: Always
        resourceClaims:
        - name: compute-domain-channel
          resourceClaimTemplateName: shivajid-sglang-kimi-k3-compute-domain-claim
        tolerations:
        - key: "kubernetes.io/arch"
          operator: "Equal"
          value: "arm64"
          effect: "NoSchedule"
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
        volumes:
        - name: gib
          emptyDir: {}
        - name: local-ssd
          emptyDir: {}
        - name: host-jit-cache
          hostPath:
            path: /var/cache/sglang_jit
            type: DirectoryOrCreate
        - name: gcs-model-volume
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes:
              bucketName: "kimik3-us-central1"
              mountOptions: "implicit-dirs,file-cache:enable-parallel-downloads:true,file-cache:parallel-downloads-per-file:100,file-cache:max-parallel-downloads:-1,file-cache:download-chunk-size-mb:50,file-cache:max-size-mb:-1"
        - name: shared-memory
          emptyDir:
            medium: "Memory"
            sizeLimit: 512Gi
        initContainers:
        - name: nccl-plugin-installer
          image: us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib-arm64:v1.0.7
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
          - |
            set -ex
            /scripts/container_entry.sh install --install-nccl
            cp -R /var/lib/gib/lib64/. /target/usr/local/gib/lib64
            cp -R /var/lib/gib/. /target/usr/local/gib
          volumeMounts:
          - mountPath: /target/usr/local/gib
            name: gib
        containers:
        - name: sglang-server
          image: lmsysorg/sglang:kimi-k3
          imagePullPolicy: Always
          securityContext:
            privileged: true
          resources:
            requests:
              nvidia.com/gpu: 4
            limits:
              nvidia.com/gpu: 4
            claims:
            - name: compute-domain-channel
          env:
          - name: LWS_WORKER_INDEX
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['leaderworkerset.sigs.k8s.io/worker-index']
          - name: LWS_LEADER_ADDRESS
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['leaderworkerset.sigs.k8s.io/leader-address']
          - name: LWS_GROUP_SIZE
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['leaderworkerset.sigs.k8s.io/group-size']
          - name: NCCL_PLUGIN_PATH
            value: /usr/local/gib/lib64
          - name: LD_LIBRARY_PATH
            value: /usr/local/gib/lib64:/usr/local/nvidia/lib64
          - name: NCCL_INIT_SCRIPT
            value: /usr/local/gib/scripts/set_nccl_env.sh
          - name: NCCL_MNNVL_ENABLE
            value: "1"
          - name: NCCL_CUMEM_ENABLE
            value: "1"
          - name: NCCL_NET_GDR_LEVEL
            value: "PIX"
          - name: NCCL_NET_GDR_C2C
            value: "1"
          - name: HF_HOME
            value: /gcs-cache/hf_cache
          - name: TMPDIR
            value: /gcs-cache/tmp
          - name: TORCH_EXTENSIONS_DIR
            value: /var/cache/sglang_jit/torch_extensions
          - name: TRITON_CACHE_DIR
            value: /var/cache/sglang_jit/triton_cache
          - name: TVM_FFI_CACHE_DIR
            value: /var/cache/sglang_jit/tvm_ffi_cache
          - name: FLASHINFER_WORKSPACE_DIR
            value: /var/cache/sglang_jit/flashinfer
          - name: SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK
            value: "0"
          - name: RUNAI_STREAMER_MEMORY_LIMIT
            value: "34359738368"
          - name: RUNAI_STREAMER_CONCURRENCY
            value: "16"
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: expandable_segments:True
          - name: TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC
            value: "3600"
          - name: NCCL_HEARTBEAT_TIMEOUT_SEC
            value: "3600"
          volumeMounts:
          - mountPath: /usr/local/gib
            name: gib
          - mountPath: /gcs-cache
            name: local-ssd
          - mountPath: /data/model
            name: gcs-model-volume
          - mountPath: /dev/shm
            name: shared-memory
          - mountPath: /var/cache/sglang_jit
            name: host-jit-cache
          - mountPath: /root/.cache/sglang
            name: host-jit-cache
            subPath: sglang_autotune
          command: ["/bin/bash", "-c"]
          args:
          - |
            set -e
            mkdir -p /gcs-cache/hf_cache /gcs-cache/tmp /var/cache/sglang_jit/torch_extensions /var/cache/sglang_jit/triton_cache /var/cache/sglang_jit/tvm_ffi_cache /var/cache/sglang_jit/flashinfer || true
            nvidia-smi
            . /usr/local/gib/scripts/set_nccl_env.sh
            pip install --break-system-packages hf_transfer fla-core google-cloud-storage || true

            MY_IP=$(hostname -I | awk '{print $1}')
            export SGLANG_HOST_IP="${MY_IP}"
            export GLOO_SOCKET_IFNAME=eth0
            export NCCL_SOCKET_IFNAME=eth0

            LEADER_HOST="${LWS_LEADER_ADDRESS:-shivajid-sglang-kimi-k3-0.shivajid-sglang-kimi-k3}"
            RANK="${LWS_WORKER_INDEX:-0}"
            SIZE="${LWS_GROUP_SIZE:-4}"
            echo "=== WAITING 20s FOR NVLINK COMPUTE DOMAIN TO SETTLE ==="
            sleep 20
            echo "=== STARTING MULTI-HOST SGLANG SERVE ==="
            echo "My IP: ${MY_IP}"
            echo "Node Rank: ${RANK} / Total Nodes: ${SIZE}"
            echo "Leader Address: ${LEADER_HOST}:20000"

            python3 -m sglang.launch_server \
              --model-path /data/model \
              --served-model-name moonshotai/Kimi-K3 \
              --tp-size 32 \
              --nnodes ${SIZE} \
              --node-rank ${RANK} \
              --dist-init-addr ${LEADER_HOST}:20000 \
              --host 0.0.0.0 \
              --port 30100 \
              --trust-remote-code \
              --reasoning-parser kimi_k3 \
              --tool-call-parser kimi_k3 \
              --mamba-full-memory-ratio 0.62 \
              --dcp-size 32 \
              --mem-fraction-static 0.80 \
              --enable-metrics \
              --watchdog-timeout 3600 \
              2>&1 | tee /gcs-cache/shivajid-sglang_server_${RANK}.log || true

            echo "=== SGLANG EXITED. SLEEPING INFINITY FOR DEBUGGING ==="
            sleep infinity

    workerTemplate:
      metadata:
        labels:
          role: worker
          app: shivajid-sglang-kimi-k3
        annotations:
          gke-gcsfuse/volumes: "true"
          gke-gcsfuse/cpu-limit: "0"
          gke-gcsfuse/memory-limit: "0"
          gke-gcsfuse/ephemeral-storage-limit: "0"
          gke-gcsfuse/file-cache-capacity: "500Gi"
          gke-gcsfuse/cache-path: "/gcs-cache"
          networking.gke.io/default-interface: "eth0"
      spec:
        nodeSelector:
         cloud.google.com/gce-topology-block: "1acd074d42cd3be9e4486b524db2e9ab"
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        serviceAccountName: workload-identity-k8s-sa
        automountServiceAccountToken: true
        subdomain: shivajid-sglang-kimi-k3
        restartPolicy: Always
        resourceClaims:
        - name: compute-domain-channel
          resourceClaimTemplateName: shivajid-sglang-kimi-k3-compute-domain-claim
        tolerations:
        - key: "kubernetes.io/arch"
          operator: "Equal"
          value: "arm64"
          effect: "NoSchedule"
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
        volumes:
        - name: gib
          emptyDir: {}
        - name: local-ssd
          emptyDir: {}
        - name: host-jit-cache
          hostPath:
            path: /var/cache/sglang_jit
            type: DirectoryOrCreate
        - name: gcs-model-volume
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes:
              bucketName: "kimik3-us-central1"
              mountOptions: "implicit-dirs,file-cache:enable-parallel-downloads:true,file-cache:parallel-downloads-per-file:100,file-cache:max-parallel-downloads:-1,file-cache:download-chunk-size-mb:50,file-cache:max-size-mb:-1"
        - name: shared-memory
          emptyDir:
            medium: "Memory"
            sizeLimit: 250Gi
        initContainers:
        - name: nccl-plugin-installer
          image: us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib-arm64:v1.0.7
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
          - |
            set -ex
            /scripts/container_entry.sh install --install-nccl
            cp -R /var/lib/gib/lib64/. /target/usr/local/gib/lib64
            cp -R /var/lib/gib/. /target/usr/local/gib
          volumeMounts:
          - mountPath: /target/usr/local/gib
            name: gib
        containers:
        - name: sglang-server
          image: lmsysorg/sglang:kimi-k3
          imagePullPolicy: Always
          securityContext:
            privileged: true
          resources:
            requests:
              nvidia.com/gpu: 4
            limits:
              nvidia.com/gpu: 4
            claims:
            - name: compute-domain-channel
          env:
