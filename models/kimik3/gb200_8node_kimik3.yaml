          - name: NCCL_CUMEM_ENABLE
            value: "1"
          - name: NCCL_NET_GDR_LEVEL
            value: "PIX"
          - name: NCCL_NET_GDR_C2C
            value: "1"
          - name: HF_HOME
            value: /gcs-cache/hf_cache
          - name: TMPDIR
            value: /gcs-cache/tmp
          - name: TORCH_EXTENSIONS_DIR
            value: /var/cache/sglang_jit/torch_extensions
          - name: TRITON_CACHE_DIR
            value: /var/cache/sglang_jit/triton_cache
          - name: TVM_FFI_CACHE_DIR
            value: /var/cache/sglang_jit/tvm_ffi_cache
          - name: FLASHINFER_WORKSPACE_DIR
            value: /var/cache/sglang_jit/flashinfer
          - name: SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK
            value: "0"
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: expandable_segments:True
          volumeMounts:
          - mountPath: /usr/local/gib
            name: gib
          - mountPath: /gcs-cache
            name: local-ssd
