apiVersion: v1
kind: Service
metadata:
  name: k3-console
  namespace: shivajid
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "k3-console-backendconfig"}'
spec:
  type: ClusterIP
  selector: { app: k3-console }
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
---
# Without this, the GCLB cuts streaming responses at its 30s default.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: k3-console-backendconfig
  namespace: shivajid
spec:
  timeoutSec: 1800
  connectionDraining:
    drainingTimeoutSec: 60
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 8080
