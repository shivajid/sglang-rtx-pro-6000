apiVersion: v1
kind: Pod
metadata:
  name: vibench-runner
spec:
  nodeSelector:
    cloud.google.com/gke-nodepool: vibebench-client-pool
  restartPolicy: Never
  containers:
  - name: runner
    image: europe-west4-docker.pkg.dev/northam-ce-mlai-tpu/sglang-repo/vibench-runner:latest
    command:
    - /bin/bash
    - -c
    args:
    - |
      # Wait for Docker daemon sidecar
      echo "Waiting for Docker daemon..."
      until docker info >/dev/null 2>&1; do
        sleep 1
      done
      echo "✓ Docker daemon is ready!"

      # Run the ViBench orchestrator (Example: build MVP for notes)
      python3 _harness/runner/scripts/build_mvp.py notes glm_5.2_gke /workspace/results/notes/glm_5.2_gke/mvp /workspace/output
      
      echo "Orchestrator complete. Sleeping to allow extracting output..."
      sleep infinity
    env:
    - name: DOCKER_HOST
      value: tcp://localhost:2375
    - name: GLM_5_2_GKE_ENDPOINT
      value: http://10.10.3.222:8002/v1
    # Seeding/Evaluation keys (uncomment and link to your K8s secrets if needed)
    # - name: ANTHROPIC_API_KEY
    #   valueFrom:
    #     secretKeyRef:
    #       name: hf-secret
    #       key: ANTHROPIC_API_KEY
    #       optional: true
    # - name: OPENAI_API_KEY
    #   valueFrom:
    #     secretKeyRef:
    #       name: hf-secret
    #       key: OPENAI_API_KEY
    #       optional: true
    volumeMounts:
    - name: env-creator-mount
      mountPath: /workspace/_harness/runner/scripts/env_creator.py
      subPath: env_creator.py
  - name: dind
    image: docker:dind
    securityContext:
      privileged: true
    env:
    - name: DOCKER_TLS_CERTDIR
      value: ""
  volumes:
  - name: env-creator-mount
    configMap:
      name: vibench-env-creator

