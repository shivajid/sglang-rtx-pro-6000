# Muse Spark Open 816B-A42B (NVFP4) on one GKE g4-standard-384 node (8x RTX PRO 6000 Blackwell,
# SM120), serving layout and flags adapted from the B200 reference command (outline.md / lmsys blog
# "AgentX Reproduction") and from the Beam SM120 deployment this file is modelled on
# (reflection-beam/nvfp4-g4-gke-dflash-beam-agentx-hicache.yaml).
#
#   kubectl apply -f nvfp4-g4-gke-dflash-muse-spark-agentx-hicache.yaml
#   kubectl logs -f -l app=muse-spark-nvfp4-g4-dflash-agentx-hicache
#   kubectl port-forward svc/muse-spark-nvfp4-dflash-agentx-hicache 30084:30080
#
# Generated by tools/render_gke_yaml.py from gke/*.template.yaml + patches/sm120-muse-cutlass-moe.patch;
# edit those, not this file.
#
# What differs from the B200 command and why (details: Meta-Muse-Spark/kernels/README.md):
#
#  1. --moe-runner-backend flashinfer_cutlass + the SM120 patch (ConfigMap below). trtllm-gen MoE
#     ships SM100/103/107 cubins only, so MuseSpark1xFp4Experts gets a FlashInfer CUTLASS NVFP4
#     backend: tokens are expanded to (token, slot) rows with top_k=1 so the kernel returns raw
#     per-expert outputs, then Muse's per-expert RMSNorm + weighted sum runs in the existing Triton
#     finalize (same contract as the Marlin path). Static activation quant scales 4/32 keep the
#     calibration-free checkpoint's FP4 block scales inside the e4m3 range.
#  2. --attention-backend trtllm_mha with --kv-cache-dtype bfloat16: the Muse default (fp8_e4m3)
#     is rejected by the FMHA-v2 prefill on SM120. --speculative-draft-attention-backend flashinfer:
#     fa4 is SM100-only.
#  3. No --enable-layernorm-sp / --enable-megamoe-for-layernorm-sp: SP prefill dispatches through the
#     TRT-LLM deferred-finalize MoE and MegaMoE is DeepGEMM/tcgen05 (SM100 only).
#  4. --disable-prefill-cuda-graph: the "breakable" prefill graphs up to 8192 tokens need more than
#     the ~9 GB/GPU left after 70 GB of weights (OOM; the Muse graph-pool pre-carve turns it into an
#     illegal-address fault). Decode graphs (DFlash verify included) are captured normally.
#  5. Memory: 96 GB per GPU instead of 180 GB. Weights are 69.8 GB/GPU + 2.6 GB drafter; verify CUDA
#     graphs take ~5 GB and the DFlash sampling buffers (bs 128 x 8 draft tokens x 202k vocab) ~2.6 GB,
#     so --mem-fraction-static 0.85 (0.87 OOMed on the first prefill) and 4096-token prefill chunks /
#     batches bound the activation peak. That leaves ~6 GB of device KV per GPU (~0.37M full-attention
#     + 0.15M SWA tokens at ratio 0.4); HiCache (--hicache-size GB per rank, pinned host memory; the
#     node has ~1.4 TiB) is what keeps 100k-200k-token AgentX prefixes reloadable instead of re-prefilled.
#  6. G4 node env from the sglang-rtx-pro-6000 recipes: CPU affinity, OMP_NUM_THREADS=24,
#     NCCL_P2P_LEVEL=SYS (direct cross-socket P2P; verified clean on gxn5, bench/p2p-test-gxn5.yaml),
#     NCCL_MIN_NCHANNELS=8, NCCL_CUMEM_ENABLE=1. Custom all-reduce is auto-disabled on 8 PCIe GPUs.
#  7. Image: a flattened, pruned copy of lmsysorg/sglang:dev-muse-spark-open (image/build_slim_image.sh:
#     stale checkout, pip cache, other-arch prebuilt JIT caches and sm100/103/107 cubins removed;
#     56 GB -> ~26 GB) because the node's 100 GB boot disk cannot hold the upstream image.
#  8. --prefill-decode-interval 1 (from the Beam AgentX tuning): DFlash cannot mix prefill and decode
#     in one batch, so force a decode round after every prefill chunk to bound ITL.
