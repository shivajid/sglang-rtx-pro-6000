               http=HTTPModes.auto,
      +        http1_settings=HTTP1Settings(
      +            header_read_timeout=keep_alive_s * 1000,
      +        ),
               http2_settings=HTTP2Settings(
                   initial_connection_window_size=http2_initial_connection_window_size,
                   max_concurrent_streams=http2_max_concurrent_streams,
      +            keep_alive_timeout=keep_alive_s,
               ),
               log_level=log_level,
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: muse-spark-nvfp4-g4-dflash-agentx-hicache
  namespace: default
  labels: {app: muse-spark-nvfp4-g4-dflash-agentx-hicache}
spec:
  replicas: 1
  strategy: {type: Recreate}   # a surge pod can never fit next to a running one
  selector:
    matchLabels: {app: muse-spark-nvfp4-g4-dflash-agentx-hicache}
  template:
    metadata:
      labels: {app: muse-spark-nvfp4-g4-dflash-agentx-hicache}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:                # the free g4 node; ...-02ac has corrupt cross-socket GPU P2P
                - gke-shd-gem-cluster-shd-gem-g4-gpu-po-31d2299c-gxn5
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      enableServiceLinks: false        # keep Service env vars out of the SGLANG_* namespace
      terminationGracePeriodSeconds: 30
      containers:
      - name: sglang
        image: aurius/sglang-muse-spark-rtxpro6000:10182026
        imagePullPolicy: IfNotPresent
        # args only, so the image entrypoint (/opt/nvidia/nvidia_entrypoint.sh) still runs.
        args:
        - bash
        - -c
        - |
          set -e
          patch -d /sgl-workspace/sglang-muse-spark/python -p1 -N -l < /patches/sm120-muse-cutlass-moe.patch
          exec sglang serve \
            --model-path /data/model/hub/models--meta-models--Muse-Spark-Open-816B-A42B-NVFP4/snapshots/4239e4db19376904f2e82c167e78f70abb5455fe \
            --served-model-name meta-models/Muse-Spark-Open-816B-A42B-NVFP4 \
            --quantization modelopt_fp4 \
            --tp-size 8 \
            --ep-size 8 \
            --moe-runner-backend flashinfer_cutlass \
            --attention-backend trtllm_mha \
            --kv-cache-dtype bfloat16 \
            --speculative-algorithm DFLASH \
            --speculative-draft-model-path /data/model/hub/models--RadixArk--Muse-Spark-Open-DFlash2/snapshots/46c90f412549c472941a68382d91a99e5e6372a0 \
            --speculative-draft-attention-backend flashinfer \
            --speculative-num-draft-tokens 8 \
            --speculative-use-block-verification \
            --disable-prefill-cuda-graph \
            --context-length 262144 \
            --page-size 128 \
            --swa-full-tokens-ratio 0.4 \
            --mem-fraction-static 0.85 \
            --chunked-prefill-size 4096 \
            --max-prefill-tokens 4096 \
            --max-running-requests 128 \
            --cuda-graph-max-bs-decode 128 \
            --prefill-decode-interval 1 \
            --enable-hierarchical-cache \
            --hicache-size 2.0 \
            --enable-cache-report \
            --reasoning-parser muse \
            --tool-call-parser muse \
            --tokenizer-worker-num 4 \
            --enable-http2 \
            --trust-remote-code \
            --watchdog-timeout 3600 \
            --host 0.0.0.0 \
            --enable-metrics \
            --port 30080
        env:
        - {name: HF_HUB_CACHE, value: /data/model/hub}
        - {name: HF_HUB_OFFLINE, value: "1"}
        # From the sglang-rtx-pro-6000 G4 recipes: pin each TP rank to its 24-core slice; also keeps
        # each rank's pinned HiCache pool on its own socket (first-touch NUMA).
        - {name: SGLANG_SET_CPU_AFFINITY, value: "1"}
        - {name: OMP_NUM_THREADS, value: "24"}
        # Direct P2P across the sockets (GPUs 0-3 / 4-7) for the TP8 all-reduces; verified clean on
        # gxn5 (bench/p2p-test-gxn5.yaml, 56/56 pairs). Do NOT schedule this on ...-02ac.
        - {name: NCCL_P2P_LEVEL, value: "SYS"}
        - {name: NCCL_MIN_NCHANNELS, value: "8"}
        - {name: NCCL_CUMEM_ENABLE, value: "1"}
        - {name: NCCL_DEBUG, value: "WARN"}
        # Reference-command env (lmsys blog): keep-alive for long agent turns, overwrite the 1M
        # checkpoint context with --context-length, python radix-tree core.
        - {name: SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN, value: "1"}
        - {name: SGLANG_TIMEOUT_KEEP_ALIVE, value: "1800"}
        - {name: SGLANG_UNIFIED_RADIX_TREE_CORE_BACKEND, value: "python"}
        # The optional prefill-sized FlashInfer autotune pass crashed on SM120; decode shapes are tuned.
        - {name: SGLANG_FLASHINFER_AUTOTUNE_EXTEND, value: "0"}
        ports:
        - {name: http, containerPort: 30080}
        resources:
          # 1Ti: 8 x 100 GB pinned HiCache host pools + process RSS + 32Gi /dev/shm; the node has
          # ~1.38 TiB allocatable. No memory limit on purpose: pinned pages are charged to the pod
          # and a limit would OOM-kill at start-up.
          requests: {cpu: "96", memory: 1Ti, nvidia.com/gpu: "8"}
          limits: {nvidia.com/gpu: "8"}
        # /ready answers instantly; /health runs a generation and exceeds the default probe timeout.
        startupProbe:                  # JIT compile + weight load + CUDA graphs + HiCache pinning
          httpGet: {path: /ready, port: http}
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 180
        readinessProbe:
          httpGet: {path: /ready, port: http}
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - {name: weights, mountPath: /data/model, readOnly: true}
        - {name: patch, mountPath: /patches, readOnly: true}
        - {name: sglang-cache, mountPath: /root/.cache/sglang}
        - {name: flashinfer-cache, mountPath: /root/.cache/flashinfer}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: weights                  # HF cache layout written by model_weight_disk/muse-downloader-job.yaml
        persistentVolumeClaim: {claimName: muse-spark-weights-pvc, readOnly: true}
      - name: patch
        configMap: {name: muse-spark-sm120-patch}
      - name: sglang-cache             # Triton/DeepGEMM JIT + autotune results survive restarts
        hostPath: {path: /var/lib/muse-spark/sglang-cache, type: DirectoryOrCreate}
      - name: flashinfer-cache         # FlashInfer sm120a JIT modules (~70 MB) survive restarts
        hostPath: {path: /var/lib/muse-spark/flashinfer-cache, type: DirectoryOrCreate}
      - name: dshm                     # pods otherwise get a 64 MiB /dev/shm
        emptyDir: {medium: Memory, sizeLimit: 32Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: muse-spark-nvfp4-dflash-agentx-hicache
  namespace: default
spec:
  selector: {app: muse-spark-nvfp4-g4-dflash-agentx-hicache}
  ports:
  - {name: http, port: 30080, targetPort: http}
