      +    def _cutlass_expert_outputs(
      +        self,
      +        hidden_states: torch.Tensor,
      +        topk_ids: torch.Tensor,
      +    ) -> tuple[torch.Tensor, torch.Tensor]:
      +        """Per-(token, slot) expert outputs from FlashInfer's CUTLASS NVFP4 MoE.
      +
      +        ``cutlass_fused_moe`` finalizes internally (route-weighted sum over the
      +        top-k experts), which would put Muse's per-expert RMSNorm after the sum.
      +        So every token is expanded into ``top_k`` rows that each select exactly
      +        one expert with weight 1.0: the kernel's "combined" output row is then
      +        that single expert's output. The GEMM work is identical (one expert
      +        pass per (token, expert) pair either way); only the activation
      +        quantization and permutation run on the expanded rows.
      +
      +        Rows whose expert is not local to this EP rank get no contribution and
      +        the kernel writes zeros for them; the returned local ids (-1 for
      +        non-local) let the finalize skip them explicitly.
      +        """
      +        from sglang.srt.layers.moe.moe_runner.flashinfer_cutlass import (
      +            _activation_type,
      +            _flashinfer_cutlass_fused_moe,
      +        )
      +        from sglang.srt.utils import next_power_of_2
      +
      +        cutlass_fused_moe, _ = _flashinfer_cutlass_fused_moe()
      +        num_tokens, hidden = hidden_states.shape
      +        topk = topk_ids.shape[1]
      +        rows = num_tokens * topk
      +
      +        local_topk_ids = topk_ids.to(torch.int32)
      +        if self._expert_map is not None:
      +            local_topk_ids = self._expert_map[local_topk_ids]
      +        local_topk_ids = local_topk_ids.contiguous()
      +
      +        # repeat_interleave always materializes a contiguous [rows, hidden]
      +        # copy. (expand().reshape() is a stride-0 *view* for a single token,
      +        # which the kernel reads with a real row stride: decode garbage.)
      +        expanded = hidden_states.repeat_interleave(topk, dim=0)
      +        selected = topk_ids.reshape(rows, 1).to(torch.int32).contiguous()
      +        unit_scales = torch.ones(rows, 1, dtype=torch.float32, device=hidden_states.device)
      +        output = torch.empty(rows, hidden, dtype=torch.bfloat16, device=hidden_states.device)
      +
      +        ep_size = self.global_num_experts // self.num_local_experts
      +        ep_rank = self.local_expert_offset // self.num_local_experts
      +        cutlass_fused_moe(
      +            output=output,
      +            input=expanded,
      +            token_selected_experts=selected,
      +            token_final_scales=unit_scales,
      +            fc1_expert_weights=self.gate_up_proj.view(torch.long),
      +            fc2_expert_weights=self.down_proj.view(torch.long),
      +            output_dtype=torch.bfloat16,
      +            input_sf=None,
      +            quant_scales=[
      +                self.w13_input_scale_quant,
      +                self.gate_up_proj_weight_scale.view(torch.int32),
      +                self.g1_alphas,
      +                self.w2_input_scale_quant,
      +                self.down_proj_weight_scale.view(torch.int32),
      +                self.g2_alphas,
      +            ],
      +            swiglu_alpha=None,
      +            swiglu_beta=None,
      +            swiglu_limit=None,
      +            ep_size=ep_size,
      +            ep_rank=ep_rank,
      +            tp_size=1,
      +            tp_rank=0,
      +            tune_max_num_tokens=next_power_of_2(rows),
      +            activation_type=_activation_type(self.moe_runner_config),
      +        )
      +        return output.view(num_tokens, topk, hidden), local_topk_ids
      +
      +    def _forward_cutlass(
      +        self,
      +        hidden_states: torch.Tensor,
      +        topk_scores: torch.Tensor,
      +        topk_ids: torch.Tensor,
      +        post_expert_norm: Optional[nn.Module],
      +        pre_expert_norm: Optional[nn.Module] = None,
      +    ) -> torch.Tensor:
      +        if post_expert_norm is None:
      +            raise ValueError(
      +                "The NVFP4 CUTLASS path requires moe_use_post_expert_norm=True. "
      +                "cutlass_fused_moe takes one GEMM1 alpha per expert, so the gate "
      +                "column of w13_weight_scale_2 is used for both halves and every "
      +                "expert output picks up a constant gain 1/r with "
      +                "r = w3_weight_scale_2 / w1_weight_scale_2, which the post-expert "
      +                "RMSNorm cancels exactly (same contract as the Marlin path)."
      +            )
      +        if pre_expert_norm is not None:
      +            hidden_states = pre_expert_norm(hidden_states)
      +        expert_outputs, local_topk_ids = self._cutlass_expert_outputs(
      +            hidden_states, topk_ids
      +        )
      +        if self._post_expert_norm is not post_expert_norm:
      +            self.set_post_expert_norm(post_expert_norm)
      +        if self._post_expert_norm_weight is not None:
      +            return fused_post_expert_norm_weighted_sum(
      +                expert_outputs,
      +                topk_scores,
      +                norm_weight=self._post_expert_norm_weight,
      +                eps=self._post_expert_norm_eps,
      +                weight_first=self._post_expert_norm_weight_first,
      +                slot_expert_ids=local_topk_ids,
      +            ).to(hidden_states.dtype)
      +        return finalize_identity_with_post_expert_norm(
      +            expert_outputs=expert_outputs,
      +            topk_scores=topk_scores,
      +            post_expert_norm=post_expert_norm,
      +            out_dtype=hidden_states.dtype,
      +        )
