      +    def _process_weights_for_cutlass(self, layer):
      +        """Prepare FlashInfer ``cutlass_fused_moe`` NVFP4 operands in place.
      +
      +        Like trtllm-gen, the CUTLASS grouped GEMM applies the activation to the
      +        *second* half of GEMM1's output (``silu(h[I:]) * h[:I]``, verified on
      +        SM120 against a dequantized reference), so Muse's ``[w1, w3]`` rows are
      +        swapped to ``[w3, w1]``. Unlike trtllm-gen there is no row shuffle:
      +        weights stay packed FP4 and only the FP8 block scales take the 128x4
      +        swizzled layout. The prepared tensors replace the canonical parameters
      +        so the model keeps one copy (3.5 GB of scales per rank at TP8).
      +
      +        GEMM1 takes one alpha per expert, so the gate column of
      +        ``gate_up_proj_weight_scale_2`` is used for both halves; the up half's
      +        constant per-expert gain is cancelled by Muse's post-expert RMSNorm
      +        (the forward refuses to run without it).
      +        """
      +        from sglang.srt.layers.quantization.utils import (
      +            reorder_w1w3_to_w3w1,
      +            swizzle_blockscale,
      +        )
      +
      +        input_scale = layer.gate_up_proj_input_scale.max().float()
      +        output_scale = layer.down_proj_input_scale.max().float()
      +        if self.quant_config.use_per_token_activation:
      +            # The released checkpoint is calibration-free (static activation
      +            # scales of exactly 1.0; the TRT-LLM path rescales per token at run
      +            # time). cutlass_fused_moe only takes one static global scale per
      +            # GEMM input and derives the per-16-element e4m3 block scales from
      +            # it, so the global scale just has to park the block scales inside
      +            # the e4m3 range: with 1.0, blocks whose amax is below ~0.012 (easy
      +            # for the SwiGLU intermediate) underflow to zero and the expert
      +            # output collapses. Measured on real Muse weights (layers 1 and 30),
      +            # quant scales of 4 (GEMM1 input, pre-normed hidden states, |x| up
      +            # to ~670 before clipping) and 32 (GEMM2 input, |act| up to ~84)
      +            # park the measured block-amax medians (~3.5 and ~0.4) in the
      +            # middle of the e4m3 window and hold the reference agreement across
      +            # a 100x activation range. The alphas below absorb the reciprocal,
      +            # so the computed values are unchanged.
      +            input_scale = torch.full_like(input_scale, 1.0 / _CUTLASS_GEMM1_ACT_QUANT_SCALE)
      +            output_scale = torch.full_like(output_scale, 1.0 / _CUTLASS_GEMM2_ACT_QUANT_SCALE)
      +        w13_weight_scale_2 = layer.gate_up_proj_weight_scale_2
      +        if w13_weight_scale_2.dim() == 2:
      +            gate_scale_2 = w13_weight_scale_2[:, 0]
      +        else:
      +            gate_scale_2 = w13_weight_scale_2
      +        copy_or_rebind_param(
      +            layer, "g1_alphas", (input_scale * gate_scale_2).to(torch.float32).contiguous()
      +        )
      +        copy_or_rebind_param(
      +            layer,
      +            "g2_alphas",
      +            (output_scale * layer.down_proj_weight_scale_2).to(torch.float32).contiguous(),
      +        )
      +        copy_or_rebind_param(layer, "w13_input_scale_quant", input_scale.reciprocal())
      +        copy_or_rebind_param(layer, "w2_input_scale_quant", output_scale.reciprocal())
      +        for weight, scale in (
      +            (layer.gate_up_proj, layer.gate_up_proj_weight_scale),
      +            (layer.down_proj, layer.down_proj_weight_scale),
      +        ):
      +            if (
      +                scale.dtype != torch.float8_e4m3fn
      +                or scale.shape[-1] != weight.shape[-1] * 2 // 16
      +            ):
      +                raise ValueError(
      +                    "Muse NVFP4 requires one FP8 scale per 16 weight elements"
      +                )
      +        w13_weight, w13_scale = layer.gate_up_proj, layer.gate_up_proj_weight_scale
      +        if layer.moe_runner_config.is_gated:
      +            w13_weight, w13_scale = reorder_w1w3_to_w3w1(w13_weight, w13_scale)
      +        w13_swizzled = swizzle_blockscale(w13_scale)
      +        w2_swizzled = swizzle_blockscale(layer.down_proj_weight_scale)
      +        if w13_swizzled.shape != w13_scale.shape:
      +            raise ValueError(
      +                "CUTLASS NVFP4 needs 2*intermediate % 128 == 0 and hidden % 64 == 0 "
      +                f"(got block-scale shape {tuple(w13_scale.shape)} "
      +                f"-> {tuple(w13_swizzled.shape)} after padding)"
      +            )
      +        copy_or_rebind_param(layer, "gate_up_proj", w13_weight.contiguous())
      +        copy_or_rebind_param(layer, "gate_up_proj_weight_scale", w13_swizzled.contiguous())
      +        copy_or_rebind_param(layer, "down_proj_weight_scale", w2_swizzled.contiguous())
      +        layer.w13_blockscale_swizzled = layer.gate_up_proj_weight_scale
      +        layer.w2_blockscale_swizzled = layer.down_proj_weight_scale
      +
