# GLM-5.3 chat console — reuses the Kimi-K3 "chatapp" (k3-console) FastAPI front end,
# pointed at the GLM-5.3 2-node sglang server (OpenAI-compatible /v1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: glm53-console-config
  namespace: shivajid
data:
  # GLM-5.3 serving Service (default ns), OpenAI-compatible. Include /v1.
  SGLANG_BASE_URL: "http://sglang-serving-on-master.default.svc.cluster.local:8000/v1"
  # Must match the server's served model name (it serves the local path).
  CHAT_MODEL: "/models/GLM-5.3"
  # No image-generation server for GLM-5.3 -> hide the image button.
  IMAGE_BASE_URL: ""
  IMAGE_MODEL: ""
  MAX_REQUEST_MB: "24"
  MAX_IMAGE_MB: "8"
  READ_TIMEOUT_SECONDS: "900"
  IMAGE_TIMEOUT_SECONDS: "600"
  DEFAULT_TEMPERATURE: "0.6"
---
apiVersion: v1
kind: Secret
metadata:
  name: glm53-console-secrets
  namespace: shivajid
type: Opaque
stringData:
  SGLANG_API_KEY: ""
  APP_TOKEN: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm53-console
  namespace: shivajid
  labels:
    app: glm53-console
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: glm53-console
  template:
    metadata:
      labels:
        app: glm53-console
    spec:
      # CPU pool — keep off the GPU nodes.
      nodeSelector:
        cloud.google.com/gke-nodepool: cpu-bench-pool
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: us-central1-docker.pkg.dev/northam-ce-mlai-tpu/glm53/glm53-console:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: glm53-console-config
            - secretRef:
                name: glm53-console-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 20
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: glm53-console
  namespace: shivajid
spec:
  type: ClusterIP
  selector:
    app: glm53-console
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
