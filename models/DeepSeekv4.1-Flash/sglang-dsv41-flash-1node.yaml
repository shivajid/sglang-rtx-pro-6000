apiVersion: v1
kind: PersistentVolume
metadata:
  name: dsv41-flash-model-pv
spec:
  capacity:
    storage: 1000Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: pd.csi.storage.gke.io
    volumeHandle: projects/northam-ce-mlai-tpu/zones/us-east5-a/disks/dsv41-flash-model-disk
    fsType: ext4
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: topology.gke.io/zone
          operator: In
          values:
          - us-east5-a
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dsv41-flash-model-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 1000Gi
  volumeName: dsv41-flash-model-pv
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sglang-sa
  namespace: default
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sglang-dsv41-flash-server
  namespace: default
  labels:
    app: sglang-dsv41-flash-server
spec:
  replicas: 1
  serviceName: sglang-dsv41-flash-svc
  selector:
    matchLabels:
      app: sglang-dsv41-flash-server
  template:
    metadata:
      labels:
        app: sglang-dsv41-flash-server
    spec:
      serviceAccountName: sglang-sa
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        cloud.google.com/gke-nodepool: gpu-spot-ssd
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: cloud.google.com/gke-spot
        operator: Exists
        effect: NoSchedule
      containers:
      - name: sglang-container
        image: lmsysorg/sglang:dev-dsv41
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          capabilities:
            add: ["IPC_LOCK", "SYS_PTRACE"]
        command:
        - python3
        - -m
        - sglang.launch_server
        args:
        - --model
        - /models/DeepSeek-V4.1-Flash
        - --trust-remote-code
        - --tp
        - "8"
        - --ep-size
        - "8"
        - --kv-cache-dtype
        - fp8_e4m3
        - --mem-fraction-static
        - "0.8"
        - --enable-deepseek-v4-fp4-indexer
        - --enable-decoder-swa-bounded-replay
        - --cuda-graph-max-bs-decode
        - "64"
        - --reasoning-parser
        - auto
        - --tool-call-parser
        - auto
        - --host
        - 0.0.0.0
        - --port
        - "30000"
        env:
        - name: SGLANG_SM120_FLASHMLA_BACKEND
          value: "triton"
        - name: SGLANG_FP8_PAGED_MQA_LOGITS_TORCH
          value: "0"
        - name: SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE
          value: "1"
        - name: NCCL_P2P_DISABLE
          value: "0"
        - name: NCCL_IB_DISABLE
          value: "1"
        - name: CUDA_DEVICE_ORDER
          value: "PCI_BUS_ID"
        - name: CUDA_VISIBLE_DEVICES
          value: "0,1,2,3,4,5,6,7"
        - name: NCCL_DEBUG
          value: "WARN"
        - name: SAFETENSORS_FAST_GPU
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        - name: SGLANG_ENABLE_DEEP_GEMM
          value: "0"
        - name: SGLANG_ENABLE_JIT_DEEPGEMM
          value: "0"
        - name: SGLANG_DISABLE_DEEP_GEMM
          value: "1"
        - name: FLASHINFER_DISABLE_VERSION_CHECK
          value: "1"
        - name: OMP_NUM_THREADS
          value: "24"
        - name: SGLANG_SET_CPU_AFFINITY
          value: "1"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: HF_TOKEN
              optional: true
        resources:
          limits:
            nvidia.com/gpu: "8"
            cpu: "192"
            memory: 1000Gi
          requests:
            nvidia.com/gpu: "8"
            cpu: "64"
            memory: 512Gi
        readinessProbe:
          httpGet:
            path: /health
            port: 30000
          initialDelaySeconds: 180
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 20
        livenessProbe:
          httpGet:
            path: /health
            port: 30000
          initialDelaySeconds: 240
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 10
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: hf-cache
          mountPath: /root/.cache/huggingface
        - name: model-dir
          mountPath: /models
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      - name: hf-cache
        emptyDir: {}
      - name: model-dir
        persistentVolumeClaim:
          claimName: dsv41-flash-model-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sglang-dsv41-flash-svc
  namespace: default
  labels:
    app: sglang-dsv41-flash-server
spec:
  type: NodePort
  selector:
    app: sglang-dsv41-flash-server
  ports:
  - name: http
    port: 30000
    targetPort: 30000
  - name: metrics
    port: 8080
    targetPort: 8080
