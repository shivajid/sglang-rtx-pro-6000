apiVersion: v1
kind: PersistentVolume
metadata:
  name: dsv4-flash-hdml-ro-pv
spec:
  storageClassName: ""
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteOnce
  claimRef:
    namespace: default
    name: dsv4-flash-hdml-pvc
  csi:
    driver: pd.csi.storage.gke.io
    volumeHandle: projects/northam-ce-mlai-tpu/zones/us-east5-a/disks/dsv4-flash-hyperdisk-balanced
    fsType: ext4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dsv4-flash-hdml-pvc
  namespace: default
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Gi
  volumeName: dsv4-flash-hdml-ro-pv
