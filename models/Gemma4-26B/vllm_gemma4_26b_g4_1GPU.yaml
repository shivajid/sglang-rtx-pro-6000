apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-gemma4-sa
  namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-gemma4-service
  namespace: default
  labels:
    app: vllm-gemma4
spec:
  type: NodePort
  selector:
    app: vllm-gemma4
  ports:
  - name: http-serving
    port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vllm-gemma4-1node-1gpu
  namespace: default
  labels:
    app: vllm-gemma4
spec:
  replicas: 1
  serviceName: "vllm-gemma4-service"
  selector:
    matchLabels:
      app: vllm-gemma4
  template:
    metadata:
      labels:
        app: vllm-gemma4
    spec:
      serviceAccountName: vllm-gemma4-sa
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        cloud.google.com/gke-nodepool: g4-384-np-1
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: vllm-container
        image: vllm/vllm-openai:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          capabilities:
            add: ["IPC_LOCK", "SYS_PTRACE"]
        command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
        args:
        - --host=0.0.0.0
        - --port=8000
        - --seed=42
        - --model=google/gemma-4-26B-A4B
        - --tensor-parallel-size=1
        - --max-model-len=12288
        - --max-num-seqs=192
        - --max-num-batched-tokens=16384
        - --no-enable-prefix-caching
        - --kv-cache-dtype=fp8
        - --gpu-memory-utilization=0.9
        - --async-scheduling
        - --block-size=16
        - --trust-remote-code
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: HF_TOKEN
        - name: OMP_NUM_THREADS
          value: "16"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        - name: VLLM_LOGGING_LEVEL
          value: "INFO"
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: 64Gi
            cpu: "16"
          requests:
            nvidia.com/gpu: "1"
            memory: 32Gi
            cpu: "8"
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /root/.cache/huggingface
          name: hf-cache
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
      - name: hf-cache
        emptyDir: {}
